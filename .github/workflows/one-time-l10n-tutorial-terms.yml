name: One-time L10N Tutorial Terms

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-l10n-tutorial-terms.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Localize tutorial user-facing terminology
        run: python3 .github/scripts/l10n_tutorial_terms_patch.py
      - name: Install tutorial terminology regression
        shell: bash
        run: |
          cp .github/scripts/l10n_tutorial_terms_regression.mjs tests/l10n-tutorial-terms.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/l10n-tutorial-terms.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/l10n-tutorial-terms.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit tutorial terminology
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/*.mjs
          git commit -m 'l10n: localize tutorial rule terminology'
          git pull --rebase origin main
          git push origin HEAD:main
# rerun: align V-SIGNAL completion-copy regression with official Korean terms
