name: Verify conditional RUN completion

on:
  push:
    branches:
      - fix/conditional-run-finish-20260830

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/conditional-run-finish-20260830
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: |
          python scripts/apply_run_finish.py
      - name: Run all regressions
        run: |
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
          git diff --check
      - name: Commit verified changes
        run: |
          rm -f scripts/apply_run_finish.py
          rm -f .github/workflows/apply-run-finish.yml
          rm -f .github/workflows/run-finish-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add conditional RUN completion"
          git push origin HEAD:fix/conditional-run-finish-20260830
