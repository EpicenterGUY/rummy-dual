name: One-time POINT-BLANK full pool v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-point-blank-full-pool-v4.yml'

permissions:
  contents: write

jobs:
  point-blank-full-pool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply POINT-BLANK 18-card full pool v4
        run: python .github/scripts/point-blank-full-pool-patch-v4.py
      - name: Syntax gate
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const s=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).join('\n');
          new Function(s);
          console.log('PASS: combined game script parses');
          NODE
      - name: Run reward compatibility first
        shell: bash
        run: |
          set -euo pipefail
          node tests/m11a-region-rewards.mjs
          node tests/point-blank-full-pool.mjs
      - name: Run dedicated regression gates
        shell: bash
        run: |
          set -euo pipefail
          node tests/point-blank-clash-foundation.mjs
          node tests/point-blank-interference.mjs
          node tests/point-blank-recovery-access.mjs
          node tests/point-blank-quick-reload.mjs
          node tests/zero-sight-full-pool.mjs
          node tests/vsignal-full-pool.mjs
          node tests/zero-sight-mixed-regression.mjs
          node tests/vsignal-mixed-regression.mjs
          node tests/theme-mix-simulation.mjs
          node tests/theme-event-foundation.mjs
          node tests/theme-reaction-order.mjs
          node tests/rummy-grace-joker.mjs
          node tests/l10n-card-style.mjs
          node tests/named-card-audit.mjs
      - name: Run all regression suites with failure diagnostic
        shell: bash
        run: |
          set -u
          count=0
          for test in tests/*.mjs; do
            if ! node "$test" >/tmp/point-blank-test.log 2>&1; then
              echo "FAILED_TEST=$test"
              echo '--- FAILURE TAIL ---'
              tail -n 180 /tmp/point-blank-test.log
              exit 1
            fi
            count=$((count+1))
          done
          echo "ALL_TESTS_PASSED=$count"
      - name: Commit POINT-BLANK full pool
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html ROADMAP.md docs/THEME_GROUPS.md docs/THEME_FULL_POOL_PLAN.md tests/named-card-audit.mjs tests/point-blank-full-pool.mjs tests/zero-sight-full-pool.mjs; then
            echo 'No project changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/THEME_GROUPS.md docs/THEME_FULL_POOL_PLAN.md tests/named-card-audit.mjs tests/point-blank-full-pool.mjs tests/zero-sight-full-pool.mjs
          git commit -m 'feat: complete POINT-BLANK 18-card full pool'
          git pull --rebase origin main
          git push origin HEAD:main
