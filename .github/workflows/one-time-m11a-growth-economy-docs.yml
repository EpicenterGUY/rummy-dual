name: One-time M11A Growth Economy Docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11a-growth-economy-docs.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply economy decision patch
        run: python .github/scripts/patch_m11a_growth_economy_docs.py
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Re-run 4,000-seed economy experiment
        env:
          M11A_ECONOMY_SEEDS: '4000'
        run: node experiments/m11a-growth-economy.mjs
      - name: Commit decision docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md docs/ROGUELIKE_MASTER_PLAN.md tests/m11a-growth-economy.mjs tests/m11a-slot-replace.mjs
          git diff --cached --check
          git commit -m 'docs: lock M11A growth economy comparison'
          git push origin HEAD:main
