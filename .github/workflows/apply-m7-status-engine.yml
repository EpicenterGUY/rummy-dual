name: Apply M7 status engine
on:
  push:
    branches: [feat/m7-status-engine-20260830]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-status-engine-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch official status engine
        run: |
          python3 scripts/m7_patch.py
          python3 scripts/m7_adjust_tests.py
          python3 scripts/m7_adjust2.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/game.js
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.rfind('<script>'); b=s.find('</script>',a)
          print(s[a+8:b])
          PY
          node --check /tmp/game.js
      - name: Run all regression suites
        run: |
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Check diff
        run: git diff --check
      - name: Remove temporary patch files
        run: rm scripts/m7_patch.py scripts/m7_adjust_tests.py scripts/m7_adjust2.py .github/workflows/apply-m7-status-engine.yml
      - name: Commit verified patch
        run: |
          git config user.name "EpicenterGUY"
          git config user.email "mintbamtol7@gmail.com"
          git add index.html tests/*.mjs scripts/m7_patch.py scripts/m7_adjust_tests.py scripts/m7_adjust2.py .github/workflows/apply-m7-status-engine.yml
          git commit -m "Normalize official status scopes and lifecycle"
          git push origin HEAD:feat/m7-status-engine-20260830
