name: One-time M8 copy timing hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m8-copy-timing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M8 copy timing patch
        run: python3 .github/scripts/m8_copy_timing_patch.py
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/named-copy-timing.mjs
          git commit -m 'fix: harden named copy timing'
          git push origin HEAD:main
