name: One-time Named Card Tutorial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-tutorial-named-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply named-card tutorial patch
        run: python3 .github/scripts/tutorial_named_card_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/tutorial_named_card_regression.mjs tests/tutorial-named-card.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/tutorial-named-card.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/tutorial-named-card.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit feature
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/*.mjs
          git commit -m 'feat: add named-card advanced tutorial'
          git pull --rebase origin main
          git push origin HEAD:main
