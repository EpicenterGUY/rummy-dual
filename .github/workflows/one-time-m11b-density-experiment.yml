name: One-time M11B Density Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11b-density-experiment.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M11B density simulation lock
        run: python3 .github/scripts/m11b_density_lock_patch.py
      - name: Install permanent regression
        shell: bash
        run: |
          cp .github/scripts/m11b_density_regression.mjs tests/m11b-density-simulation.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/m11b-density-simulation.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/m11b-density-simulation.mjs
          sed -i "s|fs.readFileSync('docs/ASYMMETRIC_RANK_PROTOTYPE.md','utf8')|fs.readFileSync(new URL('../docs/ASYMMETRIC_RANK_PROTOTYPE.md',import.meta.url),'utf8')|" tests/m11b-density-simulation.mjs
          sed -i "s|from '../../experiments/m11b-asymmetric-density.mjs'|from '../experiments/m11b-asymmetric-density.mjs'|" tests/m11b-density-simulation.mjs
      - name: Run full density baseline
        run: node experiments/m11b-asymmetric-density.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit M11B density lock
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md docs/ASYMMETRIC_RANK_PROTOTYPE.md experiments/m11b-asymmetric-density.mjs tests/m11b-density-simulation.mjs
          git commit -m 'test: lock M11B asymmetric density baseline'
          git pull --rebase origin main
          git push origin HEAD:main
