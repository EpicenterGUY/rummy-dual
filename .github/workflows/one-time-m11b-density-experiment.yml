name: One-time M11B Density Experiment v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11b-density-experiment.yml'

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic asymmetric-density simulation
        run: node experiments/m11b-asymmetric-density.mjs
