name: Apply RUMMY DUEL rules sync

on:
  push:
    branches:
      - fix/rules-sync-20260830

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix deterministic patch guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_rules_sync.py')
          s = p.read_text(encoding='utf-8')
          anchor = "\n\n# Battlefield/discard rules shown to the player."
          helper = '''\n\ndef replace_first_of_two(old: str, new: str, label: str) -> None:\n    global text\n    count = text.count(old)\n    if count != 2:\n        raise SystemExit(f'{label}: expected exactly 2 matches, found {count}')\n    text = text.replace(old, new, 1)\n'''
          if anchor not in s:
              raise SystemExit('helper insertion anchor missing')
          s = s.replace(anchor, helper + anchor, 1)
          lines = s.splitlines()
          ordered_fix = 0
          boundary_fix = 0
          for i, line in enumerate(lines):
              if "'new meld RUMMY context'" in line and line.lstrip().startswith('replace_once('):
                  lines[i] = line.replace('replace_once(', 'replace_first_of_two(', 1)
                  ordered_fix += 1
              stripped = line.lstrip()
              if stripped.startswith('"if(meldsOf(w).length>=2)return\'full\'"'):
                  lines[i] = line.replace("return'full'\"", "return'full';\"")
                  boundary_fix += 1
          if ordered_fix != 1:
              raise SystemExit(f'expected one ordered RUMMY patch fix, got {ordered_fix}')
          if boundary_fix != 1:
              raise SystemExit(f'expected one full-board statement boundary fix, got {boundary_fix}')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Apply deterministic patch
        run: python3 scripts/apply_rules_sync.py
      - name: Run rules smoke tests
        run: node tests/rules-smoke.mjs
      - name: Review resulting diff
        run: git diff --check && git diff --stat && git status --short
      - name: Remove one-shot patch machinery
        run: rm -f scripts/apply_rules_sync.py .github/workflows/apply-rules-sync.yml
      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align core rules and acquisition paths"
          git push origin HEAD:fix/rules-sync-20260830
