name: Verify UX1 attach switch tutorial
on:
  push:
    branches:
      - feat/ux1-attach-switch-tutorial-20260830
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux1-attach-switch-tutorial-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply tutorial patch
        run: |
          sed -i 's/},800)/},650)/' tools/ux1_attach_switch_patch.py
          python tools/ux1_attach_switch_patch.py
      - name: Run regressions
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];fs.writeFileSync('/tmp/game.js',m.at(-1)[1]);"
          node --check /tmp/game.js
          for f in tests/*.mjs; do node "$f"; done
          git diff --check
      - name: Commit verified changes
        run: |
          rm tools/ux1_attach_switch_patch.py
          rm .github/workflows/ux1-attach-switch.yml
          rmdir tools 2>/dev/null || true
          git config user.name "EpicenterGUY"
          git config user.email "mintbamtol7@gmail.com"
          git add -A
          git commit -m "Add attach opponent and switch tutorial"
          git push origin HEAD:feat/ux1-attach-switch-tutorial-20260830
