name: Verify UI2 desktop fullscreen readability
on:
  push:
    branches: [feat/ui2-desktop-fullscreen-readability-20260831]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui2-desktop-fullscreen-readability-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply desktop fullscreen/readability patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='\n@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}'
          assert s.count(marker)==1, s.count(marker)
          block=r'''

/* UI2 · desktop fullscreen / Korean readability / no page scroll */
@media (min-width:900px){
html,body{font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;font-synthesis:none}
body{letter-spacing:-.012em}.logo,.startLogo{letter-spacing:-.045em}.sub,.zoneTitle,.handSub,.detailText,.tutorialCoachGoal,.practiceCoachText{word-break:keep-all}
#app{width:100vw;max-width:none}#app:before{max-width:none}
}
@media (min-width:1200px){
html,body{width:100%;height:100%;min-height:100%;overflow:hidden}body{display:block}
#app{width:100vw;max-width:none;height:100dvh;min-height:0;overflow:hidden;border:0;border-radius:0;box-shadow:none}
#app:before{max-width:none}
.topbar{height:52px;padding:8px 20px 7px}.logo{font-size:25px;line-height:1}.sub{font-size:12px;margin-top:2px}.topActions .pixelBtn{font-size:11px;min-height:34px}.badge{font-size:11px;padding:5px 8px}
.main{height:calc(100dvh - 52px);min-height:0;padding:0 18px 10px;gap:8px;overflow:hidden;grid-template-columns:minmax(250px,.78fr) minmax(520px,1.55fr) minmax(280px,.82fr);grid-template-areas:"status status status" "enemy switch detail" "arena meld detail" "hand hand hand" "log log log";grid-template-rows:64px minmax(120px,21vh) minmax(140px,1fr) minmax(175px,25vh) 32px;align-items:stretch}
.main>*{min-height:0}.tutorialCoach,.practiceCoach{position:fixed;z-index:1450;right:18px;top:60px;width:min(460px,calc(100vw - 36px));max-height:calc(100dvh - 78px);overflow:auto;box-shadow:0 10px 28px #0007}
.status{height:100%;gap:12px;grid-template-columns:minmax(0,1fr) 94px minmax(0,1fr)}.hpPanel{height:100%;padding:7px 11px}.hpHead{font-size:13px}.coreHpText{font-size:11px}.hpBar{height:8px;margin-top:4px}.mid{height:100%;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px}.mid b{font-size:20px;margin:1px 0}.combatMeta{gap:5px;margin-top:4px}.statChip{font-size:10px;padding:2px 5px}
.enemyZone,.arena,.initiativeBoard,.meldZone,.detail,.handZone,.log{min-height:0}.enemyZone{height:100%;padding:9px 11px;overflow:hidden}.zoneTitle{font-size:12px;margin-bottom:5px}.backRow{min-height:0;height:calc(100% - 24px);align-items:center;justify-content:center}.backRow .cardBack{width:32px;height:46px}
.initiativeBoard{height:100%;min-height:0;align-self:stretch;padding:9px 12px}.initiativeLabel{font-size:11px}.initiativeState{font-size:20px;line-height:1.15}.switchAlert{font-size:11px;line-height:1.3}.initiativeRule{font-size:10px;line-height:1.35}.strongAttackBtn{font-size:10px}
.arena{height:100%;min-height:0;padding:8px 10px;overflow:hidden;display:flex;align-items:center}.arenaGrid{width:100%;gap:6px}.pileVisual{width:70px;height:102px}.deckStackLayer{width:61px;height:91px}.discardFace>div{width:61px!important;height:92px!important}.discardEmpty{width:61px;height:92px}.spentPile{width:70px;height:102px}.spentPile:before,.spentPile:after{width:53px;height:78px}.pileMeta{font-size:10px;min-height:27px}.pileMeta b{font-size:13px}.pileRule,.drawPath{font-size:9px}.phaseText,.fieldStrip{font-size:11px;padding:5px 8px}
.meldZone{height:100%;display:flex;flex-direction:column;overflow:hidden;padding:8px 10px}.meldZone>.zoneTitle{flex:0 0 auto}.meldRows{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.meldSide{min-height:0;height:100%;overflow:auto;padding:6px}.meldSideTitle{font-size:11px}.meldEntry{padding:6px;margin-bottom:5px}.meldEntryHead{font-size:11px}.meldNote,.needLine,.targetHint,.attackReadout{font-size:10px;line-height:1.35}.meldCardRow{min-height:0}.meldMiniCard{flex-basis:clamp(42px,6.2vh,52px);width:clamp(42px,6.2vh,52px);height:clamp(63px,9.3vh,78px)}.attachHereBtn,.retireBtn{font-size:10px!important}
.detail{position:static;height:100%;min-height:0;overflow:auto;padding:11px 14px}.detailCard{width:clamp(62px,8vh,78px);height:clamp(93px,12vh,116px);margin:0 auto 8px}.detailTitle{font-size:14px}.detailMeta{font-size:10px}.detailText{font-size:12px;line-height:1.5}.detailTip{font-size:10px;line-height:1.45}
.handZone{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:7px 12px}.handTop{flex:0 0 auto;align-items:center}.handTitle{font-size:14px}.handSub{font-size:11px}.hand{flex:1 1 auto;min-height:0;height:auto;gap:7px;padding:7px 8px 4px;align-items:center;justify-content:safe center;overflow-x:auto;overflow-y:hidden}.cardBtn{flex:0 0 clamp(72px,9.3vh,94px);width:clamp(72px,9.3vh,94px);height:clamp(108px,14vh,140px)}.cardBtn .corner{font-size:13px}.cardBtn .centerSuit{font-size:38px}.cardBtn .namedMark{font-size:8px}.selectionStrip{flex:0 0 auto;margin:3px 0;padding:4px 7px;font-size:10px;line-height:1.3}.controls{flex:0 0 auto;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.controls .pixelBtn{font-size:12px;min-height:36px;padding:6px 8px}.mulliganText{font-size:10px}.mulliganActions .pixelBtn{font-size:11px}
details.log{height:100%;min-height:0;overflow:hidden;padding:0 10px}details.log summary{height:30px;min-height:30px;font-size:11px;padding:6px 0}details.log summary small{font-size:9px}details.log[open]{position:fixed;z-index:1460;left:18px;bottom:12px;width:min(620px,calc(100vw - 36px));height:auto;max-height:42dvh;padding:8px 12px;background:#20292ef5;box-shadow:0 12px 32px #0008}details.log[open] summary{height:32px}details.log[open] #log{max-height:calc(42dvh - 48px);overflow:auto}.logLine{font-size:10px;line-height:1.45}
.startScreen{width:100vw}.startShell{width:min(100%,600px)}.startLogo{font-size:38px}.startPitch{font-size:13px;max-width:440px}.startMeta{font-size:10px}.startMenuBtn>span:first-child{font-size:15px}.startMenuBtn small{font-size:10px}.startMenuBtn .menuState{font-size:10px}.startResumeNote,.firstRunPrompt span,.startFoot{font-size:9px}.firstRunPrompt b{font-size:12px}.startAux .pixelBtn,.firstRunActions .pixelBtn{font-size:10px}
.tutorialCoachHead b{font-size:13px}.tutorialCoachGoal{font-size:11px}.tutorialCoachHint{font-size:10px}.tutorialCoachActions .pixelBtn{font-size:10px}.practiceCoachHead b{font-size:12px}.practiceCoachText{font-size:10px}
}
@media (min-width:1200px) and (max-height:760px){
.topbar{height:44px;padding:6px 18px 5px}.logo{font-size:21px}.sub{font-size:10px}.topActions .pixelBtn{min-height:30px;font-size:10px}.badge{font-size:10px;padding:4px 7px}
.main{height:calc(100dvh - 44px);padding:0 12px 6px;gap:6px;grid-template-rows:52px minmax(100px,18vh) minmax(118px,1fr) 190px 28px}
.hpPanel{padding:5px 9px}.hpHead{font-size:12px}.coreHpText{font-size:10px}.mid b{font-size:17px}.statChip{font-size:9px}.combatMeta{margin-top:2px}
.enemyZone{padding:6px 9px}.zoneTitle{font-size:11px;margin-bottom:3px}.backRow{height:calc(100% - 19px)}.backRow .cardBack{width:27px;height:39px}
.initiativeBoard{padding:6px 9px}.initiativeState{font-size:17px}.switchAlert{font-size:10px}.initiativeRule{font-size:9px}
.arena{padding:5px 8px}.arenaGrid{gap:4px}.pileVisual{width:59px;height:86px}.deckStackLayer{width:52px;height:77px}.discardFace>div{width:52px!important;height:78px!important}.discardEmpty{width:52px;height:78px}.spentPile{width:59px;height:86px}.spentPile:before,.spentPile:after{width:45px;height:67px}.pileMeta{font-size:9px}.pileRule,.drawPath{font-size:8px}.phaseText,.fieldStrip{font-size:10px;padding:4px 6px}
.meldZone{padding:5px 8px}.meldSide{padding:4px}.meldSideTitle{font-size:10px}.meldEntry{padding:4px;margin-bottom:4px}.meldEntryHead{font-size:10px}.meldNote,.needLine,.targetHint,.attackReadout{font-size:9px}.meldMiniCard{flex-basis:42px;width:42px;height:63px}
.detail{padding:8px 10px}.detailCard{width:58px;height:87px;margin-bottom:5px}.detailTitle{font-size:12px}.detailMeta{font-size:9px}.detailText{font-size:10px;line-height:1.4}.detailTip{font-size:9px}
.handZone{padding:5px 10px}.handTitle{font-size:13px}.handSub{font-size:10px}.hand{gap:5px;padding:3px 6px 2px}.cardBtn{flex-basis:clamp(62px,9.3vh,76px);width:clamp(62px,9.3vh,76px);height:clamp(92px,14vh,114px)}.cardBtn .corner{font-size:11px}.cardBtn .centerSuit{font-size:31px}.cardBtn .namedMark{font-size:7px}.selectionStrip{font-size:9px;margin:2px 0;padding:3px 6px}.controls{gap:5px}.controls .pixelBtn{font-size:10px;min-height:31px;padding:4px 6px}
.tutorialCoach,.practiceCoach{top:50px;right:12px;max-height:calc(100dvh - 62px)}details.log summary{height:26px;min-height:26px;padding:4px 0}
}
'''
          s=s.replace(marker,block+marker)
          p.write_text(s)

          r=Path('ROADMAP.md')
          road=r.read_text()
          old='- [x] 1440px 최대 전장 폭으로 1366×768 / 1920×1080 / 2560×1440 계열의 과도한 가로 늘어짐 방지\n- [ ] 실제 PC 브라우저에서 1366×768 / 1920×1080 시각 검수 및 필요 시 미세 간격 조정'
          new='- [x] 1200px 이상 데스크톱에서는 1440px 상한을 제거하고 `100vw × 100dvh` 전체 전장을 사용하도록 확장\n- [x] PC 전용 한국어 산세리프 폰트 스택(Pretendard/Noto Sans KR/Apple SD Gothic Neo/맑은 고딕 fallback)과 주요 HUD·버튼·설명 글자 크기 상향\n- [x] PC 전투 화면의 body/page 스크롤 제거 — 상태/전장/손패/접힌 로그를 뷰포트 높이 안의 고정 그리드로 배치하고 상세/공개 조합/열린 로그만 내부 스크롤 허용\n- [x] 낮은 PC 뷰포트(`max-height:760px`) 전용 압축 규칙으로 1366×768 계열 브라우저 화면 대응\n- [ ] 실제 PC 브라우저에서 1366×768 / 1920×1080 시각 검수 및 필요 시 미세 간격 조정'
          assert old in road
          r.write_text(road.replace(old,new))

          t=Path('tests/ui2-desktop-fullscreen-readability.mjs')
          t.write_text(r'''import fs from 'node:fs';
const html=fs.readFileSync(new URL('../index.html',import.meta.url),'utf8');
const road=fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8');
function ok(v,m){if(!v)throw new Error(m);console.log(`PASS: ${m}`)}
ok(html.includes('/* UI2 · desktop fullscreen / Korean readability / no page scroll */'),'desktop fullscreen/readability pass is registered');
ok(html.includes('"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif'),'desktop uses a Korean-readable native sans-serif fallback stack without external font assets');
ok(html.includes('@media (min-width:1200px){')&&html.includes('html,body{width:100%;height:100%;min-height:100%;overflow:hidden}'),'desktop viewport disables body/page scrolling');
ok(html.includes('#app{width:100vw;max-width:none;height:100dvh;min-height:0;overflow:hidden;border:0;border-radius:0;box-shadow:none}'),'desktop app fills the viewport instead of keeping the 1440px shell cap');
ok(html.includes('grid-template-areas:"status status status" "enemy switch detail" "arena meld detail" "hand hand hand" "log log log"'),'desktop grid removes tutorial/practice rows from battle flow');
ok(html.includes('.tutorialCoach,.practiceCoach{position:fixed'),'tutorial and practice coaches float on desktop instead of forcing page height growth');
ok(html.includes('.handZone{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden')&&html.includes('.hand{flex:1 1 auto;min-height:0;height:auto'),'hand area is height-contained inside the desktop viewport');
ok(html.includes('details.log[open]{position:fixed')&&html.includes('max-height:42dvh'),'expanded combat log becomes an internal floating panel instead of growing the page');
ok(html.includes('.detail{position:static;height:100%;min-height:0;overflow:auto'),'long card details scroll internally rather than the entire page');
ok(html.includes('.controls .pixelBtn{font-size:12px')&&html.includes('.detailText{font-size:12px')&&html.includes('.handTitle{font-size:14px'),'desktop HUD/action/body text is materially larger than the mobile pixel-scale baseline');
ok(html.includes('@media (min-width:1200px) and (max-height:760px){')&&html.includes('grid-template-rows:52px minmax(100px,18vh) minmax(118px,1fr) 190px 28px'),'short desktop viewports receive a dedicated no-scroll compact grid');
ok(html.includes('@media (max-width:899px){#app{width:min(100vw,480px)}'),'mobile 480px layout contract remains present');
ok(road.includes('`100vw × 100dvh` 전체 전장')&&road.includes('PC 전용 한국어 산세리프 폰트 스택')&&road.includes('body/page 스크롤 제거'),'roadmap records fullscreen, font, and no-page-scroll desktop work');
console.log('RUMMY//DUEL desktop fullscreen/readability regressions passed.');
''')
          PY
      - name: Run regressions
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];fs.writeFileSync('/tmp/game.js',m.at(-1)[1]);"
          node --check /tmp/game.js
          for f in tests/*.mjs; do node "$f"; done
          git diff --check
      - name: Commit verified changes
        run: |
          rm -f .github/workflows/ui2-desktop-fullscreen-readability.yml
          git config user.name EpicenterGUY
          git config user.email mintbamtol7@gmail.com
          git add -A
          git commit -m "Improve desktop fullscreen readability"
          git push origin HEAD:feat/ui2-desktop-fullscreen-readability-20260831
