name: One-time M11B Player Rank Choice UI v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11-slot-invariant.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align rank-choice patcher to current attach source
        run: python3 .github/scripts/m11b_rank_choice_ui_anchor_fix.py
      - name: Apply M11B player rank-choice UI
        run: python3 .github/scripts/m11b_rank_choice_ui_patch.py
      - name: Install M11B player rank-choice regression
        shell: bash
        run: |
          cp .github/scripts/m11b_rank_choice_ui_regression.mjs tests/m11b-rank-choice-ui.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/m11b-rank-choice-ui.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/m11b-rank-choice-ui.mjs
          sed -i "s|fs.readFileSync('docs/ASYMMETRIC_RANK_PROTOTYPE.md','utf8')|fs.readFileSync(new URL('../docs/ASYMMETRIC_RANK_PROTOTYPE.md',import.meta.url),'utf8')|" tests/m11b-rank-choice-ui.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit M11B player rank-choice UI
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/ASYMMETRIC_RANK_PROTOTYPE.md tests/m11b-rank-choice-ui.mjs
          git commit -m 'feat: connect M11B player rank-choice UI'
          git pull --rebase origin main
          git push origin HEAD:main
