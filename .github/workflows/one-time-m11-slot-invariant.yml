name: One-time M11 exact-slot invariant

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11-slot-invariant.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock M11 slot invariant
        run: python3 .github/scripts/m11_slot_invariant_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/m11_slot_invariant_regression.mjs tests/m11-slot-invariant.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/m11-slot-invariant.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/m11-slot-invariant.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit M11 invariant
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md tests/m11-slot-invariant.mjs
          git commit -m 'test: lock one-variant-per-slot deck invariant'
          git pull --rebase origin main
          git push origin HEAD:main
