name: One-time Theme Mix Simulation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-theme-mix-simulation.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock simulation roadmap item
        run: python3 .github/scripts/theme_mix_simulation_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/theme_mix_simulation_regression.mjs tests/theme-mix-simulation.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/theme-mix-simulation.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/theme-mix-simulation.mjs
          sed -i "s|fs.readFileSync('docs/THEME_GROUPS.md','utf8')|fs.readFileSync(new URL('../docs/THEME_GROUPS.md',import.meta.url),'utf8')|" tests/theme-mix-simulation.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit simulation lock
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md docs/THEME_GROUPS.md tests/theme-mix-simulation.mjs
          git commit -m 'test: add theme composition simulations'
          git pull --rebase origin main
          git push origin HEAD:main
