name: One-time M11A completed-run archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11a-run-history.yml'

permissions:
  contents: write

jobs:
  patch-run-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add completed-run archive
        shell: bash
        run: |
          python .github/scripts/m11a-run-history-patch.py
          python .github/scripts/m11a-run-history-compat-fix.py

      - name: Run all regression suites
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test in tests/*.mjs; do
            echo "==> $test"
            node "$test"
            count=$((count+1))
          done
          echo "Regression suites passed: $count"

      - name: Run M11A economy experiment
        shell: bash
        run: node experiments/m11a-growth-economy.mjs

      - name: Commit project patch
        shell: bash
        run: |
          if git diff --quiet -- index.html ROADMAP.md docs/ROGUELIKE_MASTER_PLAN.md tests/m11a-run-completion.mjs; then
            echo 'No project changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/ROGUELIKE_MASTER_PLAN.md tests/m11a-run-completion.mjs
          git commit -m 'feat: archive completed roguelike runs'
          git push origin HEAD:main
