name: One-time M10 board risk

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m10-board-risk.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M10 board risk patch
        run: python3 .github/scripts/m10_board_risk_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/m10_board_risk_regression.mjs tests/m10-board-risk.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/m10-board-risk.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/m10-board-risk.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit M10 board risk
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/m10-board-risk.mjs
          git commit -m 'feat: improve AI opponent-board risk scoring'
          git pull --rebase origin main
          git push origin HEAD:main
