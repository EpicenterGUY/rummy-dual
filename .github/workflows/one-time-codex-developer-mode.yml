name: One-time codex developer mode

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-codex-developer-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and apply patch
        run: |
          python3 .github/scripts/codex_developer_mode_patch_fix.py
          python3 .github/scripts/codex_developer_mode_patch.py
          python3 .github/scripts/codex_developer_test_compat.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/codex_developer_mode_regression.mjs tests/codex-developer-mode.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/codex-developer-mode.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/codex-developer-mode.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit codex and developer mode
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/codex-developer-mode.mjs tests/vsignal-encore.mjs
          git commit -m 'feat: add theme codex and developer mode'
          git pull --rebase origin main
          git push origin HEAD:main
