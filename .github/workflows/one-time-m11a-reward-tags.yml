name: One-time M11A Reward Tags v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11a-reward-tags.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M11A action-tag reward algorithm
        run: python3 .github/scripts/m11a_reward_tags_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/m11a_reward_tags_regression.mjs tests/m11a-reward-tags.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/m11a-reward-tags.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/m11a-reward-tags.mjs
          sed -i "s|fs.readFileSync('docs/ROGUELIKE_MASTER_PLAN.md','utf8')|fs.readFileSync(new URL('../docs/ROGUELIKE_MASTER_PLAN.md',import.meta.url),'utf8')|" tests/m11a-reward-tags.mjs
      - name: Update prior isolated regression context
        run: python3 .github/scripts/m11a_reward_tags_test_compat.py
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit M11A reward algorithm
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/ROGUELIKE_MASTER_PLAN.md tests/m11a-reward-tags.mjs tests/m11a-roguelike-run-init.mjs
          git commit -m 'feat: add M11A action-tag reward candidates'
          git pull --rebase origin main
          git push origin HEAD:main
