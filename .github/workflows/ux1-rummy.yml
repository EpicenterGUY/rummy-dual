name: Verify UX1 RUMMY tutorial
on:
  push:
    branches:
      - feat/ux1-rummy-tutorial-20260830
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux1-rummy-tutorial-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply RUMMY tutorial patch
        run: |
          python tools/ux1_rummy_patch.py
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          old="if(w==='player'){tutorialCheckProgress('rummy',{beforeHand:beforeReloadHand,reload,afterHand:s.hand.length});state.selected.clear();"
          new="if(w==='player'){if(typeof tutorialCheckProgress==='function')tutorialCheckProgress('rummy',{beforeHand:beforeReloadHand,reload,afterHand:s.hand.length});state.selected.clear();"
          if old not in s: raise SystemExit('missing RUMMY hook for guard refinement')
          s=s.replace(old,new,1)

          old_menu='<button id="tutorialStartBtn" class="pixelBtn startMenuBtn" type="button"><span>튜토리얼<small>전투 화면과 핵심 목표부터 익힙니다. 고정 패 실습은 순차 추가 중입니다.</small></span><span class="menuState">베타</span></button>'
          new_menu='<button id="tutorialStartBtn" class="pixelBtn startMenuBtn" type="button"><span>튜토리얼<small>기본 조작부터 러미까지 고정 패로 직접 익힙니다.</small></span><span class="menuState">시작</span></button>'
          if old_menu not in s: raise SystemExit('missing static tutorial menu copy')
          p.write_text(s.replace(old_menu,new_menu,1))

          t=Path('tests/tutorial-attach-switch.mjs')
          ts=t.read_text()
          old_test="ok(script.includes('여기까지 완료했습니다. 다음 실습은 러미입니다.') && !script.includes('다음 묶음에서는 붙이기와 상대 공개 조합 이용'), 'completion coach points to RUMMY instead of stale attach work');"
          new_test="ok(script.includes(\"step.id==='rummy'?'기본 튜토리얼 완료!\") && !script.includes('다음 묶음에서는 붙이기와 상대 공개 조합 이용'), 'completion coach now distinguishes final RUMMY completion from stale attach work');"
          if old_test not in ts: raise SystemExit('missing old attach tutorial completion-copy regression')
          t.write_text(ts.replace(old_test,new_test,1))

          st=Path('tests/start-screen.mjs')
          ss=st.read_text()
          old_start="ok(html.includes('id=\"tutorialStartBtn\"') && html.includes('튜토리얼') && html.includes('준비 중'), 'tutorial is visible but honestly marked as not implemented');"
          new_start="ok(html.includes('id=\"tutorialStartBtn\"') && html.includes('기본 조작부터 러미까지 고정 패로 직접 익힙니다.') && !html.includes('고정 패 실습은 순차 추가 중입니다.'), 'tutorial entry advertises the completed core hands-on flow');"
          if old_start not in ss: raise SystemExit('missing outdated start-screen tutorial assertion')
          st.write_text(ss.replace(old_start,new_start,1))
          PY
      - name: Run regressions
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];fs.writeFileSync('/tmp/game.js',m.at(-1)[1]);"
          node --check /tmp/game.js
          for f in tests/*.mjs; do node "$f"; done
          git diff --check
      - name: Commit verified changes
        run: |
          rm -f tools/ux1_rummy_patch.py .github/workflows/ux1-rummy.yml
          git config user.name EpicenterGUY
          git config user.email mintbamtol7@gmail.com
          git add -A
          git commit -m "Add deterministic RUMMY tutorial"
          git push origin HEAD:feat/ux1-rummy-tutorial-20260830
