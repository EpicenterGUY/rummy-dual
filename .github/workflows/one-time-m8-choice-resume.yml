name: One-time M8 resumable effect choice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m8-choice-resume.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply resumable choice patch
        run: python3 .github/scripts/m8_choice_resume_patch.py
      - name: Sync choice regression expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/named-choice-resume.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("ok(attach.indexOf('const willRummy=s.hand.length===0')>attach.indexOf('ctx.resumeEffects'),'attach recalculates RUMMY only inside finalization after resumed choices');", "ok(attach.includes(\"const finish=fx=>\")&&attach.includes(\"const willRummy=s.hand.length===0\")&&attach.includes(\"ctx.resumeEffects=()=>{const next=resolveEffects\")&&attach.includes(\"const result=finish(next)\"),'attach recalculates RUMMY in finalization reached by resumed choices');", 1)
          p.write_text(s,encoding='utf-8')
          p=Path('tests/named-choice-ui.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("fx.includes('onChoose:o=>{if(o?.card)bottom(o.card)}')", "fx.includes('onChoose:o=>{if(o?.card)bottom(o.card);resume()}')", 1)
          p.write_text(s,encoding='utf-8')
          p=Path('tests/named-effect-order.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("ok(fx.includes(\"effectCards=[...(cards||[])]\"),'dependent effect ordering is local to resolveEffects and safe for isolated-function tests');", "ok(fx.includes(\"if(!fx.effectCards){const list=[...(cards||[])]\")&&fx.includes('fx.effectCards=list'),'dependent effect ordering is initialized locally inside resolveEffects and survives resumable passes');", 1)
          s=s.replace("ok(fx.includes(\"effectCards[i]?.tag!=='goldenHand'\")&&fx.includes(\"x?.tag==='sameDiscardRank'\"),'resolver searches for a later Buyout King only when Golden Hand would otherwise resolve first');", "ok(fx.includes(\"list[i]?.tag!=='goldenHand'\")&&fx.includes(\"x?.tag==='sameDiscardRank'\"),'resolver searches for a later Buyout King only when Golden Hand would otherwise resolve first');", 1)
          s=s.replace("ok(fx.includes('const[dep]=effectCards.splice(j,1);effectCards.splice(i,0,dep)'),'Buyout King is moved immediately before the dependent Golden Hand without globally sorting unrelated effects');", "ok(fx.includes('const[dep]=list.splice(j,1);list.splice(i,0,dep)'),'Buyout King is moved immediately before the dependent Golden Hand without globally sorting unrelated effects');", 1)
          s=s.replace("ok(fx.includes('for(const c of effectCards){'),'named effects resolve from the minimally adjusted action order');", "ok(fx.includes('const effectCards=fx.effectCards')&&fx.includes('for(let i=fx.index;i<effectCards.length;i++)'),'named effects resume from the minimally adjusted action order without replaying prior effects');", 1)
          p.write_text(s,encoding='utf-8')
          p=Path('tests/named-smuggled-suit-window.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const submit=source('submitNewMeld'),attach=source('attachCards'),recover=source('playerRecover'),free=source('freeRecoverFromMeld'),retire=source('retireMeld');", "const submit=source('submitNewMeld'),attach=source('attachCards'),recover=source('playerRecover'),free=source('recoverSpecificFromMeld'),retire=source('retireMeld');", 1)
          p.write_text(s,encoding='utf-8')
          p=Path('tests/rummy-grace-joker.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("install(ctx, 'freeRecoverFromMeld');\n  ctx.freeRecoverFromMeld('player', meld, []);", "install(ctx, 'freeRecoverCandidates', 'recoverSpecificFromMeld', 'freeRecoverFromMeld');\n  ctx.freeRecoverFromMeld('player', meld, []);", 1)
          p.write_text(s,encoding='utf-8')
          p=Path('tests/safety-hardening.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("ok(source('freeRecoverFromMeld').includes('grantRecoveryReturnOverride'),'free swap recovery records authorized return destinations');", "ok(source('recoverSpecificFromMeld').includes('grantRecoveryReturnOverride'),'free swap recovery records authorized return destinations on the exact chosen recovery');", 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/named-choice-resume.mjs tests/named-choice-ui.mjs tests/named-effect-order.mjs tests/named-smuggled-suit-window.mjs tests/rummy-grace-joker.mjs tests/safety-hardening.mjs
          git commit -m 'feat: resume named effects after choices'
          git push origin HEAD:main
