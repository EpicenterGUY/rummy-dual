name: One-time M8 resumable effect choice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m8-choice-resume.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply resumable choice patch
        run: python3 .github/scripts/m8_choice_resume_patch.py
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/named-choice-resume.mjs
          git commit -m 'feat: resume named effects after choices'
          git push origin HEAD:main
