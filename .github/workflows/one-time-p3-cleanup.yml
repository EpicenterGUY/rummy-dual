name: One-time P3 Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-p3-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-run permanent regressions before cleanup
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do node "$f" >/dev/null; done
      - name: Remove completed P3 one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/scripts/p3_shell_visuals_patch.py \
            .github/scripts/p3_shell_visuals_regression.mjs \
            .github/workflows/one-time-p3-shell-visuals.yml \
            .github/workflows/one-time-p3-shell-visual-audit.yml \
            .github/scripts/p3_tutorial_board_patch.py \
            .github/scripts/p3_tutorial_board_regression.mjs \
            .github/workflows/one-time-p3-tutorial-board.yml \
            .github/workflows/one-time-p3-tutorial-visual-audit.yml \
            .github/scripts/p3_theme_accent_patch.py \
            .github/scripts/p3_theme_accent_regression.mjs \
            .github/workflows/one-time-p3-theme-accent.yml \
            .github/workflows/one-time-p3-theme-visual-audit.yml \
            .github/workflows/one-time-p3-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove completed P3 one-time helpers'
          git pull --rebase origin main
          git push origin HEAD:main
