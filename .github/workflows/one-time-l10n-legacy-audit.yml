name: One-time L10N Legacy Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-l10n-legacy-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit remaining player-facing legacy terminology
        run: python3 .github/scripts/l10n_legacy_term_audit.py
