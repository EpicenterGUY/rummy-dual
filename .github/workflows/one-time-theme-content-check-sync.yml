name: One-time Theme Content Checklist Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-theme-content-check-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync canonical theme checklist
        run: python3 .github/scripts/theme_content_check_sync.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/theme_content_check_sync_regression.mjs tests/theme-content-check-sync.mjs
          sed -i "s|fs.readFileSync('docs/THEME_GROUPS.md','utf8')|fs.readFileSync(new URL('../docs/THEME_GROUPS.md',import.meta.url),'utf8')|" tests/theme-content-check-sync.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/THEME_GROUPS.md tests/*.mjs
          git commit -m 'docs: sync canonical theme expansion checklist'
          git pull --rebase origin main
          git push origin HEAD:main
