name: One-time P3 Card Visual Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-p3-card-visual-audit.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Korean font fallback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Prepare card audit page
        shell: bash
        run: |
          cp index.html /tmp/p3-card-audit.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p3-card-audit.html')
          s=p.read_text()
          inject=r'''<script>
          window.addEventListener('load',()=>setTimeout(()=>{
            const start=document.getElementById('startScreen'); if(start) start.classList.add('hidden');
            const app=document.getElementById('app');
            const card=(rank,suit,name='',named=false,joker=false)=>{
              const sym={S:'♠',H:'♥',D:'♦',C:'♣',J:'★'}[suit];
              const red=(suit==='H'||suit==='D')?'suitRed':'';
              return `<div class="card ${named?'named':''} ${joker?'joker':''}"><div class="corner ${red}">${rank}<br>${sym}</div><div class="centerSuit ${red}">${sym}</div>${named?`<div class="namedMark">${name}</div>`:''}<div class="corner bottom ${red}">${rank}<br>${sym}</div></div>`;
            };
            app.innerHTML=`<main style="min-height:100vh;padding:40px;background:#182126;color:#edf0ea;font-family:'Noto Sans CJK KR',sans-serif">
              <h1 style="font-size:24px;margin:0 0 8px">P3 카드 팔레트 실렌더</h1><p style="margin:0 0 26px;color:#aeb9b7">일반 / 네임드 / 조커 / 미니 카드의 최종 CSS 확인</p>
              <section style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap">
                <div><b>일반 검정</b><div style="width:94px;height:140px;margin-top:8px">${card('7','S')}</div></div>
                <div><b>일반 빨강</b><div style="width:94px;height:140px;margin-top:8px">${card('Q','H')}</div></div>
                <div><b>네임드 검정</b><div style="width:94px;height:140px;margin-top:8px">${card('5','C','매복한 관측자',true)}</div></div>
                <div><b>네임드 빨강</b><div style="width:94px;height:140px;margin-top:8px">${card('5','H','앙코르',true)}</div></div>
                <div><b>조커</b><div style="width:94px;height:140px;margin-top:8px">${card('J','J','조커 킹',true,true)}</div></div>
                <div><b>공개 조합 미니</b><div class="meldMiniCard" style="margin-top:8px;width:52px;height:78px">${card('K','C','24시간 내구방송',true)}</div></div>
                <div><b>도감 미니</b><div class="codexMini" style="margin-top:8px;width:46px;height:69px">${card('4','D','전원 집합!',true)}</div></div>
              </section>
            </main>`;
          },120));
          </script>'''
          s=s.replace('</body>',inject+'</body>',1)
          p.write_text(s)
          PY
      - name: Capture desktop card sheet
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          mkdir -p visual-audit
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --window-size=1366,768 --virtual-time-budget=1400 --screenshot="visual-audit/p3-card-sheet.png" "file:///tmp/p3-card-audit.html"
      - uses: actions/upload-artifact@v4
        with:
          name: p3-card-visual-audit
          path: visual-audit/p3-card-sheet.png
          retention-days: 1
