name: One-time M8 Last Laugh choice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m8-last-laugh-choice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Last Laugh choice patch
        run: python3 .github/scripts/m8_last_laugh_choice_patch.py
      - name: Run all regressions
        shell: bash
        run: |
          set +e
          : > regression.log
          status=0
          for f in tests/*.mjs; do
            echo "== $f ==" | tee -a regression.log
            node "$f" 2>&1 | tee -a regression.log || { status=$?; break; }
          done
          echo "$status" > regression.status
          exit 0
      - name: Upload regression log
        uses: actions/upload-artifact@v4
        with:
          name: last-laugh-regression-log
          path: |
            regression.log
            regression.status
      - name: Commit patch
        shell: bash
        run: |
          test "$(cat regression.status)" = "0"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/named-last-laugh-choice.mjs
          git commit -m 'feat: make Last Laugh bottom selectable'
          git push origin HEAD:main
