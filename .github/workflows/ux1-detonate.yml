name: Verify UX1 detonation tutorial
on:
  push:
    branches:
      - feat/ux1-detonate-tutorial-20260830
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux1-detonate-tutorial-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply detonation tutorial patch
        run: python tools/ux1_detonate_patch.py
      - name: Run regressions
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];fs.writeFileSync('/tmp/game.js',m.at(-1)[1]);"
          node --check /tmp/game.js
          for f in tests/*.mjs; do node "$f"; done
          git diff --check
      - name: Commit verified changes
        run: |
          rm -f tools/ux1_detonate_patch.py .github/workflows/ux1-detonate.yml
          git config user.name EpicenterGUY
          git config user.email mintbamtol7@gmail.com
          git add -A
          git commit -m "Add deterministic detonation tutorial"
          git push origin HEAD:feat/ux1-detonate-tutorial-20260830
