name: One-time Theme AI Heuristics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-theme-ai-heuristics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply theme AI heuristic patch
        run: python3 .github/scripts/theme_ai_heuristics_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/theme_ai_heuristics_regression.mjs tests/theme-ai-heuristics.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/theme-ai-heuristics.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/theme-ai-heuristics.mjs
          sed -i "s|fs.readFileSync('docs/THEME_GROUPS.md','utf8')|fs.readFileSync(new URL('../docs/THEME_GROUPS.md',import.meta.url),'utf8')|" tests/theme-ai-heuristics.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit theme AI heuristics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/THEME_GROUPS.md tests/theme-ai-heuristics.mjs
          git commit -m 'feat: add cross-theme AI heuristics'
          git pull --rebase origin main
          git push origin HEAD:main
