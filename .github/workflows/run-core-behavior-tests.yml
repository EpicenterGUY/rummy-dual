name: Run core behavior regressions

on:
  push:
    branches:
      - test/core-behavior-regressions-20260830

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run smoke tests
        run: node tests/rules-smoke.mjs
      - name: Run core behavior tests
        run: node tests/core-behavior.mjs
      - name: Check diff
        run: git diff --check
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/run-core-behavior-tests.yml
      - name: Commit verified test suite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: verify core behavior regressions"
          git push origin HEAD:test/core-behavior-regressions-20260830
