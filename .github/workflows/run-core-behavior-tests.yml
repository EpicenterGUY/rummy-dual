name: Run core behavior regressions

on:
  push:
    branches:
      - test/core-behavior-regressions-20260830

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix function extractor body boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/core-behavior.mjs')
          s = p.read_text(encoding='utf-8')
          old = "  let brace = script.indexOf('{', start);\n  if (brace < 0) throw new Error(`missing body for ${name}`);"
          new = "  const bodyMarker = script.indexOf('){', start);\n  if (bodyMarker < 0) throw new Error(`missing body for ${name}`);\n  const brace = bodyMarker + 1;"
          if s.count(old) != 1:
              raise SystemExit(f'function extractor anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run smoke tests
        run: node tests/rules-smoke.mjs
      - name: Run core behavior tests
        run: node tests/core-behavior.mjs
      - name: Check diff
        run: git diff --check
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/run-core-behavior-tests.yml
      - name: Commit verified test suite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: verify core behavior regressions"
          git push origin HEAD:test/core-behavior-regressions-20260830
