name: RUMMY safety hardening

on:
  push:
    paths:
      - '.github/workflows/rummy-safety-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safety patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/rummy_safety_hardening.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("    brace = src.find('{', start)\n    if brace < 0:\n", "    body_marker = src.find('){', start)\n    brace = body_marker + 1\n    if body_marker < 0:\n", 1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 .github/scripts/rummy_safety_hardening.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('한쪽만 완전히 막히면 기존처럼 회수 또는 내 카드가 포함된 공개 조합 1개 긴급 정리로 순환을 복구합니다.', '한쪽의 완전 정체에서는 <b>내 카드가 포함된 공개 조합 1개를 긴급 정리</b>가 최후 안전장치이며, 가능한 합법적 회수를 먼저 사용합니다.', 1)
          p.write_text(s,encoding='utf-8')

          t=Path('tests/named-card-audit.mjs')
          q=t.read_text(encoding='utf-8')
          q=q.replace("const jokerCleanup=script.indexOf('replaceRedundantJokers(targetSide,m,w);',middleCleanup);", "const jokerCleanup=script.indexOf('replaceRedundantJokers(targetSide,m,w,cards);',middleCleanup);", 1)
          t.write_text(q,encoding='utf-8')

          t=Path('tests/named-card-behavior-2.mjs')
          q=t.read_text(encoding='utf-8')
          q=q.replace("ok(script.includes(\"c.recoverReturnOverrideToken=freeReason==='tuner'?state.turnToken:null\"),'Tuner grants same-turn attach override only to its transfer recovery');", "ok(script.includes(\"grantRecoveryReturnOverride('player',c,m,{requiredType:m.type==='SET'?'RUN':'SET',ownOnly:true})\")&&script.includes(\"grantRecoveryReturnOverride(w,c,m,{requiredType:m.type==='SET'?'RUN':'SET',ownOnly:true})\"),'Tuner grants same-turn return only to authorized own opposite-type destination melds');", 1)
          t.write_text(q,encoding='utf-8')

          t=Path('tests/rules-smoke.mjs')
          q=t.read_text(encoding='utf-8')
          q=q.replace("ok(html.includes('recoveredCardsCanReturn(cards,state.turnToken)'), 'attach path checks recovered-card return eligibility');", "ok(html.includes('recoveredCardsCanReturn(cards,state.turnToken,m)'), 'attach path checks destination-aware recovered-card return eligibility');", 1)
          t.write_text(q,encoding='utf-8')
          PY
      - name: Run buildless regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rummy-safety-hardening.yml .github/scripts/rummy_safety_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden circulation and recovery safety"
          git push origin HEAD:main
