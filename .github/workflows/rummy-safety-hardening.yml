name: RUMMY safety hardening

on:
  push:
    paths:
      - '.github/workflows/rummy-safety-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safety patch
        run: python3 .github/scripts/rummy_safety_hardening.py
      - name: Run buildless regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rummy-safety-hardening.yml .github/scripts/rummy_safety_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden circulation and recovery safety"
          git push origin HEAD:main
