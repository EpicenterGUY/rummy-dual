name: One-time L10N Mobile Wrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-l10n-mobile-wrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Korean mobile wrap safety
        run: python3 .github/scripts/l10n_mobile_wrap_patch.py
      - name: Install mobile wrap regression
        shell: bash
        run: |
          cp .github/scripts/l10n_mobile_wrap_regression.mjs tests/l10n-mobile-wrap.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/l10n-mobile-wrap.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/l10n-mobile-wrap.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit Korean mobile wrap safety
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/*.mjs
          git commit -m 'l10n: harden mobile Korean text wrapping'
          git pull --rebase origin main
          git push origin HEAD:main
