name: Apply M5 multi-attach UX

on:
  push:
    branches:
      - feat/m5-multiattach-ux-20260830

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch ordered target multi-attach UX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              text = text.replace(old, new, 1)

          def replace_function_line(name, new_source):
              global text
              pattern = rf'^function {re.escape(name)}\(.*$'
              matches = re.findall(pattern, text, flags=re.M)
              if len(matches) != 1:
                  raise SystemExit(f'{name}: expected one function line, found {len(matches)}')
              text = re.sub(pattern, new_source, text, count=1, flags=re.M)

          replace_once(
              'selected:new Set(),boardSelected:new Set(),target:null',
              'selected:new Set(),selectionOrder:[],boardSelected:new Set(),target:null',
              'selection order state',
          )

          clear_pair = 'state.selected.clear();state.boardSelected.clear();'
          clear_pair_new = 'state.selected.clear();state.selectionOrder=[];state.boardSelected.clear();'
          count = text.count(clear_pair)
          if count < 1:
              raise SystemExit('selection clear pairs not found')
          text = text.replace(clear_pair, clear_pair_new)
          text = text.replace('state.selected.clear();const got=performMaintenance', 'state.selected.clear();state.selectionOrder=[];const got=performMaintenance')

          replace_function_line('selectedCards', """function orderedSelectedCards(hand,selected,order=[]){const byUid=new Map(hand.map(c=>[c.uid,c])),out=[],seen=new Set();for(const uid of order){const c=byUid.get(uid);if(c&&selected.has(uid)&&!seen.has(uid)){out.push(c);seen.add(uid)}}for(const c of hand)if(selected.has(c.uid)&&!seen.has(c.uid)){out.push(c);seen.add(c.uid)}return out}\nfunction selectedCards(){return orderedSelectedCards(state.player.hand,state.selected,state.selectionOrder||[])}\nfunction toggleHandSelection(uid,max=Infinity){const had=state.selected.has(uid);state.selectionOrder=(state.selectionOrder||[]).filter(x=>x!==uid);if(had){state.selected.delete(uid);return false}if(state.selected.size>=max)return null;state.selected.add(uid);state.selectionOrder.push(uid);return true}\nfunction buildAttachPreview(m,cards){if(!m||!cards?.length)return null;if(m.type==='SET'){if(m.cards.length!==3||cards.length!==1)return null;return{type:'SET',steps:[{card:cards[0],amount:24}],total:24}}if(m.type==='RUN'){const steps=cards.map((card,i)=>({card,amount:chainDamage((m.chain||0)+i+1)}));return{type:'RUN',steps,total:steps.reduce((sum,x)=>sum+x.amount,0)}}return null}\nfunction attachPreview(side,index,cards=selectedCards()){const m=meldsOf(side)[index];if(!m||!cards.length||!canAttachTo(side,index,cards))return null;return buildAttachPreview(m,cards)}\nfunction attachPreviewText(p){if(!p)return'';const seq=p.steps.map(x=>`${cardText(x.card)} +${x.amount}`).join(' → ');return`${p.type==='SET'?'BURST':'CHAIN'} ${seq} · TOTAL +${p.total} · SWITCH → CPU`}\nfunction canTargetAttachMeld(side,index){if(state.turn!=='player'||state.phase!=='action')return false;const m=meldsOf(side)[index];if(!m||m.lastAttachToken===state.turnToken||(m.createdToken===state.turnToken&&side==='player'))return false;const wouldReturn=m.type==='RUN'||(m.type==='SET'&&m.cards.length===3);if(!wouldReturn)return false;if(!canSideReturn('player')||state.player.returnedSwitchThisTurn)return false;return true}\nfunction selectAttachTarget(side,index){if(state.target?.side===side&&state.target?.index===index){state.target=null;render();return true}if(!canTargetAttachMeld(side,index)){log('이 공개 조합은 이번 턴 붙이기 타겟으로 지정할 수 없습니다.','hit');return false}const cs=selectedCards();if(cs.length&&!canAttachTo(side,index,cs)){state.selected.clear();state.selectionOrder=[]}state.boardSelected.clear();state.target={side,index};render();return true}\nfunction canContinueTargetSelection(c){if(!state.target||state.selected.has(c.uid)||c.blockedUntilTurn===state.turnNo)return false;return canAttachTo(state.target.side,state.target.index,selectedCards().concat(c))}\nfunction targetNextAmount(){if(!state.target)return 0;const m=meldsOf(state.target.side)[state.target.index];if(!m)return 0;if(m.type==='SET')return 24;if(m.type==='RUN')return chainDamage((m.chain||0)+selectedCards().length+1);return 0}""")

          replace_function_line('renderHand', """function renderHand(){const el=document.getElementById('hand'),ordered=selectedCards(),orderMap=new Map(ordered.map((c,i)=>[c.uid,i+1]));el.innerHTML='';state.player.hand.forEach(c=>{const picked=state.selected.has(c.uid),targetNext=state.turn==='player'&&state.phase==='action'&&!!state.target&&!picked&&canContinueTargetSelection(c),attachN=state.turn==='player'&&state.phase==='action'&&!state.target?attachCandidates([c]).length:0,nextAmount=targetNext?targetNextAmount():0;const b=document.createElement('button');b.className='cardBtn'+(picked?' selected':'')+((targetNext||attachN)?' attachable':'');b.dataset.uid=c.uid;b.innerHTML=`<span class=\"selectedTick\">${picked?`#${orderMap.get(c.uid)}`:'선택'}</span>${targetNext?`<span class=\"quickAttachHint\">다음 +${nextAmount}</span>`:attachN?`<span class=\"quickAttachHint\">붙임 ${attachN}</span>`:''}${cardHTML(c)}`;b.onclick=()=>{if(state.turn!=='player')return;if(state.phase==='mulligan'){const r=toggleHandSelection(c.uid,3);if(r===null)log('멀리건은 최대 3장입니다.','hit')}else if(state.phase==='action'){if(state.target&&!picked&&!canContinueTargetSelection(c)){log('선택한 타겟에는 이 카드를 다음 순서로 붙일 수 없습니다.','hit');return}toggleHandSelection(c.uid)}else return;renderHand();renderDetail(c);renderMelds();updateButtons()};b.onpointerenter=()=>renderDetail(c);el.appendChild(b)});document.getElementById('playerHandCount').textContent=state.player.hand.length}""")

          replace_function_line('canAttachTo', """function canAttachTo(side,index,cards=selectedCards()){if(state.turn!=='player'||state.phase!=='action'||!cards.length)return false;if(cards.some(c=>c.blockedUntilTurn===state.turnNo))return false;const m=meldsOf(side)[index];if(!m||m.lastAttachToken===state.turnToken||(m.createdToken===state.turnToken&&side==='player'))return false;if(meldType(m.cards.concat(cards))!==m.type)return false;const wouldReturn=m.type==='RUN'||(m.type==='SET'&&m.cards.length===3&&m.cards.length+cards.length===4);if(wouldReturn&&!recoveredCardsCanReturn(cards,state.turnToken))return false;if(wouldReturn&&!canSideReturn('player'))return false;if(wouldReturn&&state.player.returnedSwitchThisTurn)return false;return true}""")

          replace_function_line('renderMelds', """function renderMelds(){const cs=selectedCards();for(const [id,side] of [['enemyMelds','enemy'],['playerMelds','player']]){const rows=meldsOf(side),el=document.getElementById(id);if(!rows.length){el.innerHTML='<div class=\"meldEmpty\">공개 조합 없음.</div>';continue}el.innerHTML=rows.map((m,i)=>{const targeted=state.target?.side===side&&state.target?.index===i,ok=canAttachTo(side,i,cs),preview=targeted?attachPreview(side,i,cs):null,note=targeted&&!cs.length?'타겟 선택 · 강조된 손패를 순서대로 선택':attachReason(side,i,cs);const ms=m.status||{};const mst=(ms.protected?` · 보호 ${ms.protected}`:'')+(ms.sealNamed?` · 효과봉인 ${ms.sealNamed}`:'');const attack=preview?`<div class=\"attackReadout ${m.type==='SET'?'burst':'chain'}\">${attachPreviewText(preview)}</div>`:m.type==='SET'?'<div class=\"attackReadout burst\">BURST READY · 마지막 1장 → 위력 +24</div>':`<div class=\"attackReadout chain\">CHAIN ${m.chain||0} · 다음 연장 위력 +${chainDamage((m.chain||0)+1)}</div>`;const cls=m.type==='SET'?'burstReady':m.type==='RUN'&&(m.chain||0)>=2?'chainHot':'';return`<div class=\"meldEntry ${ok?'validAttach':''} ${targeted?'target':''} ${cls}\" data-side=\"${side}\" data-index=\"${i}\"><div class=\"meldEntryHead\"><span class=\"meldType ${m.type==='SET'?'gold':'cyan'}\">${side==='enemy'?'CPU':'YOU'} · ${m.type} · ${m.cards.length}장</span><span class=\"meldNote ${ok||targeted?'good':'no'}\">${note}</span></div><div class=\"meldCardRow\">${m.cards.map((c,j)=>{const recoverable=state.turn==='player'&&state.phase==='action'&&canRecoverCard('player',side,i,j),pick=state.boardSelected.has(c.uid),fixed=c.owner!=='player';return`<button class=\"meldMiniCard ${recoverable?'recoverable':''} ${pick?'boardPick':''} ${fixed?'fixedCard':''}\" data-side=\"${side}\" data-index=\"${i}\" data-card=\"${j}\" title=\"${c.name}\"><span class=\"ownerDot ${c.owner}\"></span>${recoverable?'<span class=\"recoverTag\">회수</span>':fixed?'<span class=\"fixedTag\">상대</span>':''}${cardHTML(c)}</button>`}).join('')}</div>${attack}<div class=\"needLine\">${mst}<br>${meldNeedText(m)}</div><div class=\"recombineHint\">${targeted?'타겟 지정됨 · 손패의 「다음」 표시 카드를 차례로 고르세요.':side==='enemy'?'내가 붙인 카드도 조건을 만족하면 회수 가능':'내가 제어하는 카드만 기본 회수 가능'}</div>${ok?`<button type=\"button\" class=\"attachHereBtn\" data-attach-side=\"${side}\" data-attach-index=\"${i}\">+ 선택 ${cs.length}장 붙이기${preview?` · TOTAL +${preview.total}`:''}</button>`:''}</div>`}).join('');document.querySelectorAll(`#${id} .meldMiniCard`).forEach(b=>{b.onclick=e=>{e.stopPropagation();const targetSide=b.dataset.side,mi=+b.dataset.index,ci=+b.dataset.card,c=meldsOf(targetSide)[mi]?.cards[ci];if(!c)return;renderDetail(c);if(canRecoverCard('player',targetSide,mi,ci)){if(state.boardSelected.has(c.uid))state.boardSelected.clear();else{state.boardSelected.clear();state.boardSelected.add(c.uid)}renderMelds();updateButtons()}}});document.querySelectorAll(`#${id} .attachHereBtn`).forEach(b=>{b.onclick=e=>{e.stopPropagation();playerAttachTo(b.dataset.attachSide,+b.dataset.attachIndex)}});document.querySelectorAll(`#${id} .meldEntry`).forEach(row=>{row.onclick=e=>{e.stopPropagation();selectAttachTarget(row.dataset.side,+row.dataset.index)}})}renderTargetHint()}""")

          replace_function_line('renderTargetHint', """function renderTargetHint(){const e=document.getElementById('targetHint'),strip=document.getElementById('selectionStrip'),cs=selectedCards(),bs=boardSelectedCards();if(state.phase==='mulligan'){e.className='targetHint idle';e.textContent='멀리건 중 · 손패에서 최대 3장을 골라 교체하세요.';if(strip)strip.innerHTML=`멀리건 선택 <b>${cs.length}/3장</b>`;return}const rp=recoverPlan(),cand=attachCandidates(cs),t=cs.length===3?meldType(cs):null,limit=state.turn==='player'&&state.phase==='action'?maintenanceLimit('player'):0,tm=state.target?meldsOf(state.target.side)[state.target.index]:null,preview=state.target?attachPreview(state.target.side,state.target.index,cs):null;if(rp){e.className='targetHint good';e.innerHTML=`<b>회수 가능</b> · ${rp.side==='enemy'?'상대':'내'} 공개 조합의 ${cardText(rp.card)}을 되돌려도 ${rp.meld.type} 유지`}else if(tm&&preview){e.className='targetHint good';e.innerHTML=`<b>${state.target.side==='enemy'?'CPU':'YOU'} ${tm.type} 타겟</b> · ${attachPreviewText(preview)}`}else if(tm){e.className='targetHint good';e.innerHTML=`<b>${state.target.side==='enemy'?'CPU':'YOU'} ${tm.type} 타겟 선택</b> · 손패에서 「다음」으로 강조된 카드를 붙일 순서대로 고르세요.`}else if(cand.length){e.className='targetHint good';e.innerHTML=`<b>붙이기 가능 ${cand.length}곳</b> · 공개 조합을 눌러 타겟으로 지정하면 다중붙이기 순서를 안내합니다.`}else if(state.player.returnedSwitchThisTurn){e.className='targetHint idle';e.innerHTML='<b>이번 턴 SWITCH 반환 완료.</b> 새 3장 조합·회수·정비는 가능하지만 추가 BURST/CHAIN 반환은 불가.'}else if(limit){e.className='targetHint good';e.innerHTML=limit===2?'<b>완전 막힘 · 정비 강화</b> · 손패 1~2장을 덱 아래로 보내고 같은 수만큼 교체할 수 있습니다.':'<b>정비 가능</b> · 평소에도 손패 1장을 덱 아래로 보내고 1장 교체할 수 있습니다.'}else{e.className='targetHint idle';e.textContent='새 조합은 정확히 3장. 다중붙이기는 공개 RUN을 먼저 눌러 타겟으로 지정할 수 있습니다.'}if(strip){const bits=[];if(t&&!state.player.newMeldUsed)bits.push(`<span class=\"ok\">${t} 3장 새 조합</span>`);if(tm)bits.push(`<span class=\"ok\">타겟 ${state.target.side==='enemy'?'CPU':'YOU'} ${tm.type}</span>`);else if(cand.length)bits.push(`<span class=\"ok\">붙이기 ${cand.length}곳</span>`);if(preview)bits.push(`<span class=\"ok\">${attachPreviewText(preview)}</span>`);if(rp)bits.push('<span class=\"ok\">회수 가능</span>');if(state.player.returnedSwitchThisTurn)bits.push('<span class=\"warn\">반환 1회 사용</span>');if(limit&&cs.length>=1&&cs.length<=limit)bits.push(`<span class=\"ok\">정비 ${cs.length}/${limit}장</span>`);if(cs.length===1)bits.push('버리기 가능');strip.innerHTML=`손패 <b>${cs.map((c,i)=>`${i+1}:${cardText(c)}`).join(' → ')||'없음'}</b>${bs.length?` · 공개 선택 <b>${bs.map(cardText).join(' ')}</b>`:''} · ${bits.length?bits.join(' · '):'<span class=\"warn\">실행 가능한 선택을 찾는 중</span>'}`}}""")

          replace_function_line('updateButtons', """function updateButtons(){const cs=selectedCards(),t=cs.length===3?meldType(cs):null,rp=recoverPlan(),action=state.turn==='player'&&state.phase==='action',draw=state.turn==='player'&&state.phase==='draw',mull=state.phase==='mulligan';const meldBtn=document.getElementById('meldBtn');meldBtn.disabled=!(action&&cs.length===3&&t&&!state.player.newMeldUsed&&state.player.melds.length<2);let meldText='새 3장 조합';if(state.player.newMeldUsed)meldText='새 조합 사용함';else if(state.player.melds.length>=2&&t)meldText='공개 조합 2/2 · 새 조합 불가';else if(t==='SET')meldText='SET 3장 구축 · BURST READY';else if(t==='RUN')meldText='RUN 3장 구축 · CHAIN 0';meldBtn.textContent=meldText;const attachBtn=document.getElementById('attachBtn'),cand=attachCandidates(cs),preview=state.target?attachPreview(state.target.side,state.target.index,cs):null;attachBtn.disabled=state.target?!preview:!cand.length;if(state.target){attachBtn.textContent=preview?`붙이기 · TOTAL +${preview.total} · SWITCH→CPU`:'타겟에 붙일 카드 선택'}else if(cand.length===1&&cs.length){const p=attachPreview(cand[0].side,cand[0].index,cs);attachBtn.textContent=p?`붙이기 · TOTAL +${p.total} · SWITCH→CPU`:'붙이기 · 효과 준비'}else attachBtn.textContent=cand.length?`붙이기 가능 ${cand.length}곳`:'붙이기 없음';const recoverBtn=document.getElementById('recoverBtn');recoverBtn.disabled=!rp;recoverBtn.textContent=state.player.recoveredThisTurn?'회수 사용함':rp?`${rp.side==='enemy'?'상대 조합 · ':''}${cardText(rp.card)} 회수`:'내 카드 회수';const mb=document.getElementById('maintenanceBtn'),limit=action?maintenanceLimit('player'):0;mb.hidden=!limit;mb.disabled=!(limit&&cs.length>=1&&cs.length<=limit);mb.textContent=limit===2?(cs.length>=1&&cs.length<=2?`정비 ${cs.length}장 · 막힘 보정`:'정비 · 최대 2장'):limit===1?(cs.length===1?'정비 1장 교환':'정비 · 1장 선택'):'정비 사용함';document.getElementById('discardBtn').disabled=!(action&&cs.length===1);document.getElementById('discardBtn').textContent=cs.length===1?`${cardText(cs[0])} 버리기${(state.player.discardsRemaining||1)>1?` · ${(state.player.discardsRemaining||1)}회 남음`:''}`:`1장 버리기${(state.player.discardsRemaining||1)>1?` · ${(state.player.discardsRemaining||1)}회 남음`:''}`;document.getElementById('drawDeckBtn').disabled=!draw;document.getElementById('drawDeckBtn').textContent='덱 1장 뽑기';document.getElementById('drawDiscardBtn').disabled=!(draw&&state.discard.length);const dr=document.getElementById('deckRuleText');if(dr)dr.textContent='맨 위 1장 뽑기';for(const id of['deckPile','discardPile'])document.getElementById(id).classList.toggle('disabled',id==='deckPile'?!draw:!(draw&&state.discard.length));document.getElementById('mulliganBar').classList.toggle('show',mull);document.getElementById('mulliganBtn').disabled=!(mull&&cs.length>0&&cs.length<=3);document.getElementById('mulliganBtn').textContent=`선택 ${Math.min(cs.length,3)}장 교체`;renderTargetHint()}""")

          p.write_text(text, encoding='utf-8')
          print('M5 multi-attach UX patch applied')
          PY
      - name: Run all regression suites
        run: |
          node tests/rules-smoke.mjs
          node tests/core-behavior.mjs
          node tests/rummy-grace-joker.mjs
          node tests/hand-circulation.mjs
          node tests/final-rule-audit.mjs
          node tests/multiattach-ux.mjs
      - name: Check diff
        run: git diff --check && git diff --stat
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/apply-m5-multiattach.yml
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add ordered target multi-attach UX"
          git push origin HEAD:feat/m5-multiattach-ux-20260830
