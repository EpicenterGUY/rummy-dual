name: One-time M11A Roguelike Run Init

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11a-run-init.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M11A roguelike run initialization
        run: python3 .github/scripts/m11a_run_init_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/m11a_run_init_regression.mjs tests/m11a-roguelike-run-init.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/m11a-roguelike-run-init.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/m11a-roguelike-run-init.mjs
          sed -i "s|fs.readFileSync('docs/ROGUELIKE_MASTER_PLAN.md','utf8')|fs.readFileSync(new URL('../docs/ROGUELIKE_MASTER_PLAN.md',import.meta.url),'utf8')|" tests/m11a-roguelike-run-init.mjs
          sed -i "s|fs.readFileSync('docs/ROGUELIKE_DECK_STARTERS.md','utf8')|fs.readFileSync(new URL('../docs/ROGUELIKE_DECK_STARTERS.md',import.meta.url),'utf8')|" tests/m11a-roguelike-run-init.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit M11A roguelike run initialization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/ROGUELIKE_MASTER_PLAN.md docs/ROGUELIKE_DECK_STARTERS.md tests/m11a-roguelike-run-init.mjs
          git commit -m 'feat: add M11A roguelike run draft initialization'
          git pull --rebase origin main
          git push origin HEAD:main
