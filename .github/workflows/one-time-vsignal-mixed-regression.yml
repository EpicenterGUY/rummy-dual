name: One-time V-SIGNAL mixed regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-vsignal-mixed-regression.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install mixed regression
        shell: bash
        run: |
          cp .github/scripts/vsignal_mixed_regression.mjs tests/vsignal-mixed-regression.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/vsignal-mixed-regression.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/vsignal-mixed-regression.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ROADMAP.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Updated: 2026-08-30','Updated: 2026-08-31',1)
          old='- [ ] V-SIGNAL ↔ 일반 카드 혼합 회귀 테스트'
          if old not in s:
              raise SystemExit('missing V-SIGNAL mixed regression roadmap item')
          s=s.replace(old,'- [x] V-SIGNAL ↔ 일반 카드 혼합 회귀 테스트',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit verified regression
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md tests/vsignal-mixed-regression.mjs
          git commit -m 'test: lock V-SIGNAL mixed interactions'
          git pull --rebase origin main
          git push origin HEAD:main
