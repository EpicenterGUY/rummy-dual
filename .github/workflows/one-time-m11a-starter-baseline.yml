name: One-time M11A Starter Baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11a-starter-baseline.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply starter baseline patch
        run: python .github/scripts/patch_m11a_starter_baseline.py
      - name: Isolate starter slot constant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          slots="['S3','S4','S5','S6','S7','S8','S9','H2','H3','H4','H7','H8','H9','D2','D3','D4','D5','D6','D7','D8','C3','C4','C5','C6','C7','C8','C9','S10','H10']"
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='const ROGUELIKE_STARTER_REGULAR_SLOTS=Object.freeze(CORE_IDS.slice(0,29));'
          new=f'const ROGUELIKE_STARTER_REGULAR_SLOTS=Object.freeze({slots});'
          if old not in s:
              raise SystemExit('starter slot constant anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('tests/m11a-roguelike-run-init.mjs')
          s=p.read_text(encoding='utf-8')
          old="ok(script.includes('const ROGUELIKE_STARTER_REGULAR_SLOTS=Object.freeze(CORE_IDS.slice(0,29));'),'starter baseline reuses the canonical 29-slot structure');"
          new="ok(script.includes(\"const ROGUELIKE_STARTER_REGULAR_SLOTS=Object.freeze(['S3','S4','S5'\"),'starter baseline keeps an isolated canonical 29-slot structure');"
          if old not in s:
              raise SystemExit('starter slot regression anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Run all regressions
        shell: bash
        run: |
          set +e
          : > starter-baseline-test-report.txt
          failed=0
          for f in tests/*.mjs; do
            echo "== $f ==" | tee -a starter-baseline-test-report.txt
            node "$f" 2>&1 | tee -a starter-baseline-test-report.txt
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              echo "FAILED_FILE=$f RC=$rc" | tee -a starter-baseline-test-report.txt
              failed=$rc
              break
            fi
          done
          exit "$failed"
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m11a-starter-regression-report
          path: starter-baseline-test-report.txt
      - name: Recheck structural baseline
        env:
          M11A_ECONOMY_SEEDS: '4000'
        run: node experiments/m11a-growth-economy.mjs
      - name: Commit M11A starter baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions-bot@users.noreply.github.com'
          git add index.html ROADMAP.md docs/ROGUELIKE_MASTER_PLAN.md docs/ROGUELIKE_DECK_STARTERS.md tests/m11a-roguelike-run-init.mjs tests/m11a-reward-tags.mjs
          git diff --cached --check
          git commit -m 'feat: lock M11A starter baseline v1'
          git push origin HEAD:main
