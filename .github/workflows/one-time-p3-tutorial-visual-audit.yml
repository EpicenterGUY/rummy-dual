name: One-time P3 Tutorial Visual Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-p3-tutorial-visual-audit.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Korean font fallback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Prepare tutorial capture page
        shell: bash
        run: |
          cp index.html /tmp/p3-tutorial.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p3-tutorial.html')
          s=p.read_text()
          inject=r'''<script>window.addEventListener('load',()=>setTimeout(()=>document.getElementById('tutorialStartBtn')?.click(),180));</script>'''
          s=s.replace('</body>',inject+'</body>',1)
          p.write_text(s)
          PY
      - name: Capture tutorial desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          mkdir -p visual-audit
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --window-size=1366,768 --virtual-time-budget=1800 --screenshot="visual-audit/tutorial-desktop.png" "file:///tmp/p3-tutorial.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --window-size=390,844 --virtual-time-budget=1800 --screenshot="visual-audit/tutorial-mobile.png" "file:///tmp/p3-tutorial.html"
      - uses: actions/upload-artifact@v4
        with:
          name: p3-tutorial-visual-audit
          path: visual-audit/*.png
          retention-days: 1
