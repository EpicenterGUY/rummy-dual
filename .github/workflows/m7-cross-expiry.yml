name: Verify M7 cross-meld expiry
on:
  push:
    branches: [feat/m7-status-engine-20260830]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-status-engine-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/m7_cross_expiry.py
      - name: Check syntax and regressions
        run: |
          python3 -c "from pathlib import Path; s=Path('index.html').read_text(); a=s.rfind('<script>'); b=s.find('</script>',a); print(s[a+8:b])" > /tmp/game.js
          node --check /tmp/game.js
          for f in tests/*.mjs; do node "$f"; done
          git diff --check
      - name: Remove temporary files and commit
        run: |
          rm scripts/m7_cross_expiry.py .github/workflows/m7-cross-expiry.yml
          git config user.name "EpicenterGUY"
          git config user.email "mintbamtol7@gmail.com"
          git add index.html tests/status-engine.mjs scripts/m7_cross_expiry.py .github/workflows/m7-cross-expiry.yml
          git commit -m "Cover fixed status across public meld ownership"
          git push origin HEAD:feat/m7-status-engine-20260830
