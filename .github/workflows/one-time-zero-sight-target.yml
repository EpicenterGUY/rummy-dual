name: One-time ZERO//SIGHT target foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-zero-sight-target.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply target foundation patch
        run: python3 .github/scripts/m8a_zero_sight_target_patch.py
      - name: Install target regression
        shell: bash
        run: |
          cp .github/scripts/zero_sight_target_regression.mjs tests/zero-sight-target-foundation.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/zero-sight-target-foundation.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/zero-sight-target-foundation.mjs
          sed -i "s|fs.readFileSync('docs/THEME_GROUPS.md','utf8')|fs.readFileSync(new URL('../docs/THEME_GROUPS.md',import.meta.url),'utf8')|" tests/zero-sight-target-foundation.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit target foundation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/THEME_GROUPS.md tests/zero-sight-target-foundation.mjs
          git commit -m 'feat: add ZERO//SIGHT target foundation'
          git pull --rebase origin main
          git push origin HEAD:main
