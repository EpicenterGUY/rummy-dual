name: One-time M9 jokers and fields

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m9-jokers-fields.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M9 patch
        run: python3 .github/scripts/m9_jokers_fields_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/m9_jokers_fields_regression.mjs tests/m9-jokers-fields.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/m9-jokers-fields.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/m9-jokers-fields.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit M9
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/m9-jokers-fields.mjs
          git commit -m 'feat: lock M9 jokers and shared fields'
          git pull --rebase origin main
          git push origin HEAD:main
