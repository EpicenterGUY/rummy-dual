name: One-time M8A V-SIGNAL Encore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m8a-vsignal-encore.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Encore patch
        run: python3 .github/scripts/m8a_vsignal_encore_patch.py
      - name: Add Encore regression
        shell: bash
        run: |
          cat > tests/vsignal-encore.mjs <<'EOF'
          import fs from 'node:fs';
          import vm from 'node:vm';

          const html=fs.readFileSync(new URL('../index.html',import.meta.url),'utf8');
          const script=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).join('\n');
          const road=fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8');
          const themeDoc=fs.readFileSync(new URL('../docs/THEME_GROUPS.md',import.meta.url),'utf8');
          function ok(v,m){if(!v)throw new Error(m);console.log(`PASS: ${m}`)}
          function source(name){const marker=`function ${name}(`,start=script.indexOf(marker);if(start<0)throw new Error(`missing ${name}`);let par=0,brace=-1;for(let i=start+marker.length-1;i<script.length;i++){if(script[i]==='(')par++;else if(script[i]===')')par--;else if(script[i]==='{'&&par===0){brace=i;break}}if(brace<0)throw new Error(`missing body ${name}`);let d=0;for(let i=brace;i<script.length;i++){if(script[i]==='{')d++;else if(script[i]==='}'&&--d===0)return script.slice(start,i+1)}throw new Error(`unterminated ${name}`)}

          ok(script.includes("'VSH5':{slot:'H5',themeId:'v-signal',n:'앙코르',t:'vEncore'"),'Encore is a V-SIGNAL alternate for the H5 slot');
          ok(script.includes("items:['S8','H5','VSH5','D9','C8','D10','C3']"),'Encore is live at the existing H5 unlock timing');
          ok(source('namedSlot').includes("NAMED[id]?.slot||id"),'alternate variants continue to share one physical rank+suit slot');
          ok(script.includes("vEncore:['cycle','combo']"),'Encore has common cycle/combo tendencies instead of a theme-only resource tag');
          ok(source('makeCard').includes('encoreGrantToken:null')&&source('makeCard').includes('encoreReturnUsedToken:null'),'Encore once-per-turn state is explicit on card objects');

          const handler=source('handleVSignalThemeEvent');
          ok(script.includes('subscribeEffectEvent(handleVSignalThemeEvent);'),'V-SIGNAL behavior is wired through the shared event bus');
          let calls=0;const sourceMeld={id:'source'},targetMeld={id:'target'};
          const sandbox={globalThis:null,grantRecoveryReturnOverride:(actor,c,m)=>{calls++;ok(actor==='player','Encore grants permission to the recovering controller');ok(m===sourceMeld,'Encore excludes from the exact recovered source meld via the shared target helper');c.recoverReturnOverrideToken=77;c.recoverReturnTargets=[targetMeld];return 1},log:()=>{}};sandbox.globalThis=sandbox;
          vm.runInNewContext(`${handler};globalThis.__handle=handleVSignalThemeEvent;`,sandbox);
          const encore={themeId:'v-signal',tag:'vEncore',name:'앙코르',encoreGrantToken:null};
          ok(sandbox.__handle({event:'onRecover',actor:'player',card:encore,meld:sourceMeld,turnToken:77})===true,'recovering Encore grants its return exception');
          ok(encore.encoreGrantToken===77&&calls===1,'Encore records that its once-per-turn grant was spent');
          ok(sandbox.__handle({event:'onRecover',actor:'player',card:encore,meld:sourceMeld,turnToken:77})===false&&calls===1,'same-turn re-recovery cannot recharge Encore');
          ok(sandbox.__handle({event:'onRecover',actor:'player',card:{themeId:null,tag:'vEncore'},meld:sourceMeld,turnToken:78})===false,'non-theme cards cannot impersonate Encore');

          const consume=source('consumeEncoreReturnPermission');
          const box={globalThis:null};box.globalThis=box;vm.runInNewContext(`${consume};globalThis.__consume=consumeEncoreReturnPermission;`,box);
          const used={themeId:'v-signal',tag:'vEncore',recoveredToken:77,recoverReturnOverrideToken:77,recoverReturnTargets:[targetMeld],encoreReturnUsedToken:null};
          ok(box.__consume([used],77,{id:'wrong'})===0&&used.recoverReturnOverrideToken===77,'Encore permission stays destination-bound and is not consumed by a wrong meld');
          ok(box.__consume([used],77,targetMeld)===1,'Encore permission is consumed by its exact legal return destination');
          ok(used.recoverReturnOverrideToken===null&&used.recoverReturnTargets===null&&used.encoreReturnUsedToken===77,'successful Encore return clears the reusable permission immediately');

          const attach=source('attachCards');
          ok(attach.includes("willBaseReturn&&typeof consumeEncoreReturnPermission==='function'"),'only BURST/CHAIN-style returning attaches consume Encore permission');
          const canReturn=source('recoveredCardCanReturn');
          ok(canReturn.includes('recoverReturnTargets.includes(targetMeld)'),'existing same-turn recovery exception remains exact-destination bound');
          const legalTargets=source('legalRecoveryReturnTargets');
          ok(legalTargets.includes('if(m===sourceMeld'),'Encore cannot bounce directly back into the meld it was just recovered from');

          ok(script.includes('테마 ${themeDef(c.themeId)?.displayName||c.themeId}'),'card detail visibly labels themed cards');
          ok(script.includes('n.themeId?` · 테마 ${themeDef(n.themeId)?.displayName||n.themeId}`'),'codex visibly labels themed named variants');
          ok(road.includes('5♥ `앙코르` 라이브 구현')&&road.includes('- [x] `앙코르` 등 회수 후 동일 턴 반환 예외를 카드 단위로 안전하게 구현'),'ROADMAP records Encore and the card-scoped return exception as complete');
          ok(themeDoc.includes('이 카드를 회수한 턴에도 한 번')&&themeDoc.includes('- [x] 회수 후 동일 턴 반환 예외를 카드 단위로 안전하게 허용'),'canonical theme document locks the self-replay wording and implementation');
          ok(!script.includes('hypeCount')&&!script.includes('HYPE_COUNT'),'Encore adds no HYPE counter or dedicated resource');
          console.log('V-SIGNAL Encore regression passed.');
          EOF
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit Encore
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/THEME_GROUPS.md tests/vsignal-encore.mjs
          git commit -m 'feat: implement V-SIGNAL Encore'
          git push origin HEAD:main
