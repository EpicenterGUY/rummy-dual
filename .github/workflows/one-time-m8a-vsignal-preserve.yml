name: One-time M8A V-SIGNAL preservation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m8a-vsignal-preserve.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply preservation patch
        run: python3 .github/scripts/m8a_vsignal_preserve_patch.py
      - name: Add preservation regression
        shell: bash
        run: |
          cp .github/scripts/vsignal_retire_preserve_diagnose.mjs tests/vsignal-retire-preserve.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/vsignal-retire-preserve.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/vsignal-retire-preserve.mjs
          sed -i "s|fs.readFileSync('docs/THEME_GROUPS.md','utf8')|fs.readFileSync(new URL('../docs/THEME_GROUPS.md',import.meta.url),'utf8')|" tests/vsignal-retire-preserve.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set +e
          : > regression.log
          status=0
          for f in tests/*.mjs; do
            echo "== $f ==" | tee -a regression.log
            node "$f" 2>&1 | tee -a regression.log || { status=$?; break; }
          done
          echo "$status" > regression.status
          exit 0
      - name: Commit and push with diagnostics
        shell: bash
        run: |
          set +e
          : > commit.log
          final=0
          {
            echo "REGRESSION_STATUS=$(cat regression.status)"
            git status --short
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html ROADMAP.md docs/THEME_GROUPS.md tests/vsignal-retire-preserve.mjs
            echo '--- staged ---'
            git status --short
            git diff --cached --stat
            if [ "$(cat regression.status)" != "0" ]; then
              echo 'regressions failed; refusing commit'
              final=20
            else
              git commit -m 'feat: add V-SIGNAL retire preservation'
              c=$?
              echo "COMMIT_STATUS=$c"
              if [ "$c" != "0" ]; then
                final=$c
              else
                git pull --rebase origin main
                r=$?
                echo "REBASE_STATUS=$r"
                if [ "$r" != "0" ]; then
                  final=$r
                else
                  git push origin HEAD:main
                  p=$?
                  echo "PUSH_STATUS=$p"
                  final=$p
                fi
              fi
            fi
          } 2>&1 | tee commit.log
          echo "$final" > commit.status
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: preserve-commit-diagnostics
          path: |
            regression.log
            regression.status
            commit.log
            commit.status
