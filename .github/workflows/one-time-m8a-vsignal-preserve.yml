name: One-time M8A V-SIGNAL preservation

# corrected continuation assertions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m8a-vsignal-preserve.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply preservation patch
        run: python3 .github/scripts/m8a_vsignal_preserve_patch.py
      - name: Add preservation regression
        shell: bash
        run: |
          cp .github/scripts/vsignal_retire_preserve_diagnose.mjs tests/vsignal-retire-preserve.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/vsignal-retire-preserve.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/vsignal-retire-preserve.mjs
          sed -i "s|fs.readFileSync('docs/THEME_GROUPS.md','utf8')|fs.readFileSync(new URL('../docs/THEME_GROUPS.md',import.meta.url),'utf8')|" tests/vsignal-retire-preserve.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit preservation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/THEME_GROUPS.md tests/vsignal-retire-preserve.mjs
          git commit -m 'feat: add V-SIGNAL retire preservation'
          git pull --rebase origin main
          git push origin HEAD:main
