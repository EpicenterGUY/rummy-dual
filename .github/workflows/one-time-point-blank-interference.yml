name: One-time POINT-BLANK Movement and Cover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-point-blank-interference.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply POINT-BLANK movement and cover patch
        run: python3 .github/scripts/point_blank_interference_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/point_blank_interference_regression.mjs tests/point-blank-interference.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/point-blank-interference.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/point-blank-interference.mjs
          sed -i "s|fs.readFileSync('docs/THEME_GROUPS.md','utf8')|fs.readFileSync(new URL('../docs/THEME_GROUPS.md',import.meta.url),'utf8')|" tests/point-blank-interference.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit POINT-BLANK movement and cover
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/THEME_GROUPS.md tests/point-blank-interference.mjs
          git commit -m 'feat: lock POINT-BLANK movement and cover interactions'
          git pull --rebase origin main
          git push origin HEAD:main
