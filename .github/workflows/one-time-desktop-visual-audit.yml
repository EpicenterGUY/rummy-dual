name: One-time Desktop Visual Audit Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-desktop-visual-audit.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record completed desktop visual audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ROADMAP.md')
          s=p.read_text()
          old='- [ ] 실제 PC 브라우저에서 1366×768 / 1920×1080 시각 검수 및 필요 시 미세 간격 조정'
          new='- [x] 실제 Chromium에서 1366×768 / 1920×1080 시작창·대전 화면 시각 검수 — Noto CJK 한글 실제 글자폭으로 잘림·겹침·가로 오버플로 없음 확인. 1080p의 넓은 공개 조합 여유 공간은 실제 조합 누적을 위한 공간으로 유지하며 추가 간격 조정 불필요'
          if s.count(old)!=1:
              raise SystemExit(f'desktop visual audit roadmap anchor mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit audit lock and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-desktop-visual-audit.yml
          git add ROADMAP.md
          git commit -m 'docs: lock desktop Chromium visual audit'
          git pull --rebase origin main
          git push origin HEAD:main
