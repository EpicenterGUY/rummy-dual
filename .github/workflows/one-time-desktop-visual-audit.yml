name: One-time Desktop Visual Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-desktop-visual-audit.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Prepare battle capture page
        shell: bash
        run: |
          cp index.html /tmp/rummy-battle.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/rummy-battle.html')
          s=p.read_text()
          inject="""<script>window.addEventListener('load',()=>setTimeout(()=>document.getElementById('battleStartBtn')?.click(),120));</script>"""
          s=s.replace('</body>',inject+'</body>',1)
          p.write_text(s)
          PY
      - name: Capture 1366x768 and 1920x1080
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-audit
          for SIZE in 1366,768 1920,1080; do
            LABEL="${SIZE/,/x}"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --window-size="$SIZE" --virtual-time-budget=1200 --screenshot="visual-audit/start-$LABEL.png" "file://$GITHUB_WORKSPACE/index.html"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --window-size="$SIZE" --virtual-time-budget=1800 --screenshot="visual-audit/battle-$LABEL.png" "file:///tmp/rummy-battle.html"
          done
          file visual-audit/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-audit
          path: visual-audit/*.png
          retention-days: 1
