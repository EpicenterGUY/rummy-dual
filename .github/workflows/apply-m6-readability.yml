name: Apply M6 combat readability

on:
  push:
    branches:
      - feat/m6-combat-readability-20260830

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch combat readability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          def repl(old, new, label, count=1):
              global text
              n = text.count(old)
              if n != count:
                  raise SystemExit(f'{label}: expected {count} match(es), found {n}')
              text = text.replace(old, new, count)

          repl(
              '.attackReadout{font-size:7px;font-weight:900;margin-top:3px}.attackReadout.burst{color:var(--gold)}.attackReadout.chain{color:var(--cyan)}',
              '.attackReadout{font-size:8px;font-weight:900;margin-top:4px;padding:5px 6px;border:1px solid #000;background:#0a111b;box-shadow:0 0 0 1px #2f3d55 inset;line-height:1.35}.attackReadout.burst{color:var(--gold);background:#231c0d}.attackReadout.chain{color:var(--cyan);background:#0d2024}.switchAlert{margin:4px 0 2px;padding:4px 5px;border:1px solid #000;background:#0b111a;color:#a9b5c8;font-size:7px;font-weight:900;line-height:1.3}.switchAlert.imminent{color:#fff0f2;background:#4a1721;box-shadow:0 0 0 2px #b7485a inset;animation:detonateWarn .65s ease-in-out infinite alternate}.switchAlert.enemyImminent{color:#ffd6dc;background:#32151d;box-shadow:0 0 0 1px #8e3c4b inset}.switchAlert.incoming{color:#ffe3a6;background:#2b2412;box-shadow:0 0 0 1px #8b7136 inset}.switchAlert.safe{color:#a9e9d2;background:#10251e}.phaseText.detonateRisk{color:#fff0f2;background:#451621;box-shadow:0 0 0 2px #b7485a inset,0 0 16px #ef65752b;font-weight:900}.initiativeBoard.selfThreat{box-shadow:0 0 0 2px #b7485a inset,0 0 18px #ef65752b}.initiativeRule{font-size:7px}.coreBreakNote{font-weight:900}.combatBanner.break{max-width:94%;text-align:center}@keyframes detonateWarn{to{filter:brightness(1.2);transform:translateY(-1px)}}',
              'upgrade combat readouts and warning hierarchy',
          )

          repl(
              '<div class="coreBreakNote">DETONATE는 현재 CORE까지만 피해 · 초과 피해 관통 없음</div>',
              '<div class="coreBreakNote">CORE BREAK · 초과 피해 LOST · 다음 CORE 관통 0</div>',
              'player core no-pierce note',
          )
          repl(
              '<div class="coreBreakNote">CORE BREAK 시 폭탄·CHAIN 리셋</div>',
              '<div class="coreBreakNote">CORE BREAK · 초과 피해 LOST · 다음 CORE 관통 0</div>',
              'enemy core no-pierce note',
          )
          repl(
              '<div class="switchGauge"><i id="switchGaugeFill"></i></div><div id="switchRule" class="initiativeRule">BURST/CHAIN으로 위력을 더해 상대에게 넘깁니다.</div>',
              '<div class="switchGauge"><i id="switchGaugeFill"></i></div><div id="switchAlert" class="switchAlert safe">중립 · DETONATE 없음</div><div id="switchRule" class="initiativeRule">BURST/CHAIN으로 위력을 더해 상대에게 넘깁니다.</div>',
              'add switch alert line',
          )

          old_core = "function coreBreak(w,overkill=0,reason='피해'){const s=sideObj(w);s.cores=Math.max(0,(s.cores||1)-1);s.shield=0;combatBanner('CORE BREAK','break',130);pulsePanel(w,'break',110);log(`${switchName(w)} CORE BREAK · ${s.cores} CORE 남음.${overkill>0?` OVERKILL ${overkill} · 관통 없음.`:''}`,'hit');if(overkill>0)fxNode(`OVERKILL ${overkill} · NO PIERCE`,'status',w,180);resetBombCycle('CORE BREAK',true);if(s.cores<=0){s.hp=0;checkGameOver();return true}s.hp=s.maxHp;fxNode(`NEXT CORE ${s.hp}/${s.maxHp}`,'heal',w,260);return true}"
          new_core = "function coreBreak(w,overkill=0,reason='피해'){const s=sideObj(w);s.cores=Math.max(0,(s.cores||1)-1);s.shield=0;combatBanner('CORE BREAK','break',130);pulsePanel(w,'break',110);log(`${switchName(w)} CORE BREAK · ${s.cores} CORE 남음.${overkill>0?` OVERKILL ${overkill} LOST · NO PIERCE.`:''}`,'hit');if(overkill>0){fxNode(`OVERKILL ${overkill} LOST · NO PIERCE`,'status',w,180);combatBanner(`${overkill} LOST · NO PIERCE`,'break',260)}resetBombCycle('CORE BREAK',true);if(s.cores<=0){s.hp=0;checkGameOver();return true}s.hp=s.maxHp;fxNode(`NEXT CORE ${s.hp}/${s.maxHp}`,'heal',w,430);return true}"
          repl(old_core, new_core, 'make overkill loss explicit')

          repl(
              "m.type==='SET'?'<div class=\"attackReadout burst\">BURST READY · 마지막 1장 → 위력 +24</div>':`<div class=\"attackReadout chain\">CHAIN ${m.chain||0} · 다음 연장 위력 +${chainDamage((m.chain||0)+1)}</div>`",
              "m.type==='SET'?'<div class=\"attackReadout burst\">BURST READY · 4번째 카드 +24 · SWITCH 반환</div>':`<div class=\"attackReadout chain\">CHAIN ${m.chain||0} · NEXT +${chainDamage((m.chain||0)+1)} · SWITCH 반환</div>`",
              'promote burst and next-chain readout',
          )

          lines = text.splitlines()
          new_render_initiative = "function renderInitiative(){const el=document.querySelector('.initiativeBoard'),txt=document.getElementById('initiativeState'),btn=document.getElementById('strongAttackBtn'),g=document.getElementById('switchGaugeFill'),rule=document.getElementById('switchRule'),alert=document.getElementById('switchAlert');if(!el||!txt)return;el.classList.toggle('playerLead',state.switchTarget==='player');el.classList.toggle('enemyLead',state.switchTarget==='enemy');for(const c of['danger','critical','overload','lethal','selfThreat'])el.classList.remove(c);const targetKey=state.switchTarget,target=targetKey!=='neutral'?sideObj(targetKey):null,need=target?target.hp+target.shield:Infinity,isLethal=!!target&&state.switchPower>=need&&state.switchPower>0,targetTurn=targetKey!=='neutral'&&targetKey===state.turn,deficit=target?Math.max(0,need-state.switchPower):0,over=Math.max(0,state.switchPower-(Number.isFinite(need)?need:state.switchPower));if(state.switchPower>=100)el.classList.add('overload');else if(state.switchPower>=70)el.classList.add('critical');else if(state.switchPower>=40)el.classList.add('danger');if(isLethal)el.classList.add('lethal');if(targetKey==='player'&&state.switchPower>0)el.classList.add('selfThreat');txt.className=`initiativeState ${targetKey==='neutral'?'neutral':targetKey}`;const tier=[state.switchPower>=100?'OVERLOAD':'',isLethal?'CORE LETHAL':''].filter(Boolean).join(' · ')||(state.switchPower>=70?'CRITICAL':state.switchPower>=40?'DANGER':'');txt.textContent=targetKey==='neutral'?`중립 · ${state.switchPower}`:`${targetKey==='player'?'YOU':'CPU'} ← SWITCH ${state.switchPower}${tier?` · ${tier}`:''}`;if(g)g.style.width=`${Math.min(100,state.switchPower/OVERLOAD*100)}%`;if(alert){if(targetKey==='neutral'||state.switchPower<=0){alert.className='switchAlert safe';alert.textContent='중립 · DETONATE 없음'}else if(targetTurn&&targetKey==='player'){alert.className='switchAlert imminent';alert.textContent=`⚠ 내 턴 종료 시 DETONATE ${state.switchPower} · 반환 필요`}else if(targetTurn&&targetKey==='enemy'){alert.className='switchAlert enemyImminent';alert.textContent=`CPU 턴 종료 시 DETONATE ${state.switchPower}`}else if(targetKey==='player'){alert.className='switchAlert incoming';alert.textContent=`⚠ SWITCH → YOU · 다음 내 턴 종료 전 반환 준비`}else{alert.className='switchAlert safe';alert.textContent=`SWITCH → CPU · CPU가 다음 반환/DETONATE 대상`}}if(rule){if(targetKey==='neutral')rule.textContent='BURST/CHAIN으로 폭탄을 시작하세요.';else{const margin=isLethal?`CORE LETHAL · ${over} 초과`:`CORE까지 ${deficit}`;const shieldText=target.shield?` · SHIELD ${target.shield}`:'';rule.textContent=`현재 CORE ${target.hp}/${target.maxHp}${shieldText} · ${margin}${state.fuseUsed?' · 이 폭탄 유예 사용됨':''}`}}if(btn){btn.disabled=true;btn.classList.toggle('returnSpent',!!sideObj(state.turn)?.returnedSwitchThisTurn);btn.textContent=isLethal?'CORE LETHAL':targetTurn?`DETONATE ${state.switchPower}`:state.switchPower>=100?'OVERLOAD':targetKey==='neutral'?'스위치 대기':`${state.switchPower} 누적`}}"
          found = 0
          for i, line in enumerate(lines):
              if line.startswith('function renderInitiative(){'):
                  lines[i] = new_render_initiative
                  found += 1
          if found != 1:
              raise SystemExit(f'renderInitiative replacement: expected 1 line, found {found}')
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          repl(
              "document.getElementById('phaseText').textContent=phase;renderInitiative();",
              "const phaseEl=document.getElementById('phaseText');phaseEl.textContent=phase;phaseEl.classList.toggle('detonateRisk',state.turn==='player'&&state.switchTarget==='player'&&state.switchPower>0);renderInitiative();",
              'style imminent player phase',
          )

          p.write_text(text, encoding='utf-8')
          print('M6 combat readability patch applied')
          PY
      - name: Run all regression suites
        run: |
          node tests/rules-smoke.mjs
          node tests/core-behavior.mjs
          node tests/rummy-grace-joker.mjs
          node tests/hand-circulation.mjs
          node tests/final-rule-audit.mjs
          node tests/multiattach-ux.mjs
          node tests/combat-readability.mjs
      - name: Check diff
        run: git diff --check && git diff --stat
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/apply-m6-readability.yml
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve combat readability"
          git push origin HEAD:feat/m6-combat-readability-20260830
