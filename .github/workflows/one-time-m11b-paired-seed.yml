name: One-time M11B Paired Seed v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11b-paired-seed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M11B paired-seed experiment control
        run: |
          python3 .github/scripts/m11b_paired_seed_runner.py
          python3 .github/scripts/m11b_paired_seed_compat.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/m11b_paired_seed_regression.mjs tests/m11b-paired-seed.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/m11b-paired-seed.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/m11b-paired-seed.mjs
          sed -i "s|fs.readFileSync('docs/ASYMMETRIC_RANK_PROTOTYPE.md','utf8')|fs.readFileSync(new URL('../docs/ASYMMETRIC_RANK_PROTOTYPE.md',import.meta.url),'utf8')|" tests/m11b-paired-seed.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit M11B paired-seed experiment control
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/ASYMMETRIC_RANK_PROTOTYPE.md tests/m11b-dev-sandbox.mjs tests/m11b-paired-seed.mjs
          git commit -m 'feat: add paired M11B experiment seeds'
          git pull --rebase origin main
          git push origin HEAD:main
# rerun v3: robust duplicate event-block cleanup and onclick regression
