name: One-time Theme Slot Metadata Invariant

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-theme-slot-metadata.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock roadmap invariant
        run: python3 .github/scripts/theme_slot_metadata_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/theme_slot_metadata_regression.mjs tests/theme-slot-metadata-invariant.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/theme-slot-metadata-invariant.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/theme-slot-metadata-invariant.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit invariant lock
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md tests/theme-slot-metadata-invariant.mjs
          git commit -m 'test: lock theme slot and metadata invariants'
          git pull --rebase origin main
          git push origin HEAD:main
