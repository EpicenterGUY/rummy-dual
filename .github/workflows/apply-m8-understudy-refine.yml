name: Verify M8 Understudy role fallback
on:
  push:
    branches: [fix/m8-named-stabilization-2-20260830]
permissions:
  contents: write
jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m8-named-stabilization-2-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refinement
        run: python3 scripts/m8_understudy_refine.py
      - name: Check syntax and regressions
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];fs.writeFileSync('/tmp/game.js',m.at(-1)[1]);"
          node --check /tmp/game.js
          for f in tests/*.mjs; do node "$f"; done
          git diff --check
      - name: Remove temporary files and commit
        run: |
          rm scripts/m8_understudy_refine.py .github/workflows/apply-m8-understudy-refine.yml
          git config user.name "EpicenterGUY"
          git config user.email "mintbamtol7@gmail.com"
          git add -A
          git commit -m "Refine Understudy suit-role fallback"
          git push origin HEAD:fix/m8-named-stabilization-2-20260830
