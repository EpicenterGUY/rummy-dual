name: One-time M8 off-turn choice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m8-offturn-choice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply off-turn choice patch
        run: python3 .github/scripts/m8_offturn_choice_patch.py
      - name: Align split-turn regression
        run: python3 .github/scripts/m8_offturn_testfix.py
      - name: Run all regressions
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/offturn-regression.log
          status=0
          for f in tests/*.mjs; do
            { echo "== $f =="; node "$f"; } 2>&1 | tee -a /tmp/offturn-regression.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              status=$rc
              break
            fi
          done
          exit "$status"
      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offturn-regression-log
          path: /tmp/offturn-regression.log
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/named-offturn-choice.mjs tests/deadlock-circulation.mjs
          git commit -m 'feat: add off-turn named choice continuation'
          git push origin HEAD:main
