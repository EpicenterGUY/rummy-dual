name: One-time L10N Card Style

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-l10n-card-style.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize named-card effect style
        run: python3 .github/scripts/l10n_card_style_patch.py
      - name: Install style regression
        shell: bash
        run: |
          cp .github/scripts/l10n_card_style_regression.mjs tests/l10n-card-style.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/l10n-card-style.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/l10n-card-style.mjs
          sed -i "s|fs.readFileSync('docs/NEW_USER_UX_TERMS.md','utf8')|fs.readFileSync(new URL('../docs/NEW_USER_UX_TERMS.md',import.meta.url),'utf8')|" tests/l10n-card-style.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit style normalization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/NEW_USER_UX_TERMS.md tests/*.mjs
          git commit -m 'l10n: normalize named-card effect style'
          git pull --rebase origin main
          git push origin HEAD:main
# rerun: align M8 and named-card text contracts
