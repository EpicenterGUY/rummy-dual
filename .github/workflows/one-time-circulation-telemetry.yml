name: One-time circulation telemetry instrumentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-circulation-telemetry.yml'

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch circulation telemetry
        run: python3 .github/scripts/add_circulation_telemetry.py

      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done

      - name: Commit instrumentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/circulation-telemetry.mjs
          git commit -m 'feat: add live circulation telemetry'
          git push origin HEAD:main

# rerun after optional telemetry hooks were isolated from extracted-function tests
