name: One-time character theme picker fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-theme-picker-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply theme picker patch
        run: python3 .github/scripts/theme_picker_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/theme_picker_regression.mjs tests/character-theme-picker.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/character-theme-picker.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit character theme picker
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/character-theme-picker.mjs
          git commit -m 'fix: show theme groups in character selection'
          git pull --rebase origin main
          git push origin HEAD:main
