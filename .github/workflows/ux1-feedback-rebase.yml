name: Rebase UX1 feedback onto latest main

on:
  push:
    branches:
      - feat/ux1-feedback-fx-rebased-20260830

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux1-feedback-fx-rebased-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bring verified UX1 feedback onto latest main
        run: |
          git fetch origin feat/ux1-feedback-fx-20260830
          git checkout origin/feat/ux1-feedback-fx-20260830 -- index.html tests/ux1-feedback.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ROADMAP.md')
          s=p.read_text(encoding='utf-8')
          old='- [ ] 세부 애니메이션 / 스위치 이동 / 러미 피드백 보강'
          new='- [x] 세부 애니메이션 / 스위치 이동 / 러미 피드백 보강 — 버스트/체인 반환 시 현재 위치→상대 위치 스위치 플라이트, 폭탄 종료 시 중립 복귀, 러미 6/7장 리필 배너·손패 딜 인, 튜토리얼 성공 펄스 및 850ms 전환 피드백 추가'
          if old not in s:
              raise SystemExit('UX1 feedback roadmap anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Run regressions
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];fs.writeFileSync('/tmp/game.js',m.at(-1)[1]);"
          node --check /tmp/game.js
          for f in tests/*.mjs; do echo "== $f =="; node "$f"; done
          git diff --check
      - name: Commit rebased verified changes
        run: |
          rm .github/workflows/ux1-feedback-rebase.yml
          git config user.name "EpicenterGUY"
          git config user.email "mintbamtol7@gmail.com"
          git add -A
          git commit -m "Polish switch movement and RUMMY feedback"
          git push origin HEAD:feat/ux1-feedback-fx-rebased-20260830
