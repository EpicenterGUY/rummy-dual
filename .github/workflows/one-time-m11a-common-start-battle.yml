name: One-time M11A common-start battle progression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11a-common-start-battle.yml'

permissions:
  contents: write

jobs:
  patch-common-start-battle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch common-start progression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          def function_span(src, name):
              marker = f'function {name}('
              start = src.find(marker)
              if start < 0:
                  raise SystemExit(f'missing function {name}')
              brace = src.find('{', start + len(marker))
              if brace < 0:
                  raise SystemExit(f'missing function brace {name}')
              depth = 0
              quote = None
              esc = False
              i = brace
              while i < len(src):
                  ch = src[i]
                  if quote:
                      if esc:
                          esc = False
                      elif ch == '\\':
                          esc = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in "'\"`":
                      quote = ch
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
                  i += 1
              raise SystemExit(f'unterminated function {name}')

          def replace_function(src, name, replacement):
              start, end = function_span(src, name)
              return src[:start] + textwrap.dedent(replacement).strip() + src[end:]

          def insert_after_function(src, name, addition):
              _, end = function_span(src, name)
              return src[:end] + '\n' + textwrap.dedent(addition).strip() + '\n' + src[end:]

          route_decl = """const ROGUELIKE_COMMON_START_ROUTE=Object.freeze([
            Object.freeze({id:'common-1',label:'공통 시작 · 첫 교전',kind:'battle'}),
            Object.freeze({id:'common-2',label:'공통 시작 · 두 번째 교전',kind:'battle'}),
            Object.freeze({id:'common-3',label:'공통 시작 · 지역 관문',kind:'battle'})
          ]);"""
          if 'const ROGUELIKE_COMMON_START_ROUTE=' not in text:
              anchor = "const ROGUELIKE_COMMON_START_ZONE='common-start';"
              if anchor not in text:
                  raise SystemExit('missing common-start zone declaration')
              text = text.replace(anchor, anchor + '\n' + textwrap.dedent(route_decl).strip(), 1)

          text = replace_function(text, 'normalizeRoguelikeRewardNodes', r'''
          function normalizeRoguelikeRewardNodes(rewards,runDeck,runId){
           if(!rewards||rewards.version!==1||!Number.isSafeInteger(rewards.baseRevision)||rewards.baseRevision<0||rewards.baseRevision>runDeck.revision||!Array.isArray(rewards.entries))return null;
           const entries=[];let revision=rewards.baseRevision,battleIndex=0;
           for(let i=0;i<rewards.entries.length;i++){
            const raw=rewards.entries[i],sequence=i+1,source=raw?.source;
            if(!raw||raw.sequence!==sequence||raw.id!==roguelikeRewardNodeId(runId,sequence)||!['prototype','battle'].includes(source)||raw.algorithm!==ROGUELIKE_REWARD_ALGORITHM||raw.revision!==revision||typeof raw.deckSignature!=='string'||!['pending','claimed','skipped'].includes(raw.status)||!Array.isArray(raw.picks)||raw.picks.length>ROGUELIKE_REWARD_ROLES.length)return null;
            if(source==='battle'){
             const routeNode=ROGUELIKE_COMMON_START_ROUTE[battleIndex];
             if(!routeNode||raw.battleIndex!==battleIndex||raw.battleNodeId!==routeNode.id)return null;
             battleIndex++
            }else if(raw.battleIndex!==undefined||raw.battleNodeId!==undefined)return null;
            if(raw.status==='pending'&&i!==rewards.entries.length-1)return null;
            const picks=[],ids=new Set();
            for(let j=0;j<raw.picks.length;j++){
             const p=raw.picks[j];
             if(!p||typeof p.id!=='string'||!NAMED[p.id]||p.id.startsWith('J')||p.role!==ROGUELIKE_REWARD_ROLES[j].id||ids.has(p.id)||!ROGUELIKE_STARTER_REGULAR_SLOTS.includes(p.slot)||namedSlot(p.id)!==p.slot)return null;
             if(p.fromVariant!==null&&(typeof p.fromVariant!=='string'||!NAMED[p.fromVariant]||p.fromVariant.startsWith('J')||namedSlot(p.fromVariant)!==p.slot))return null;
             if(p.fromVariant===p.id)return null;
             ids.add(p.id);picks.push({id:p.id,role:p.role,slot:p.slot,fromVariant:p.fromVariant});
            }
            if(raw.status==='claimed'){if(!picks.some(p=>p.id===raw.selectedId))return null;revision++}
            else if(raw.selectedId!==null)return null;
            entries.push({id:raw.id,sequence,source,algorithm:raw.algorithm,status:raw.status,revision:raw.revision,deckSignature:raw.deckSignature,picks,selectedId:raw.selectedId,...(source==='battle'?{battleIndex:raw.battleIndex,battleNodeId:raw.battleNodeId}:{})});
           }
           if(revision!==runDeck.revision)return null;
           const cards=runDeck.cards.map(c=>({...c}));
           for(let i=entries.length-1;i>=0;i--){
            const node=entries[i];
            if(node.status==='claimed'){
             const pick=node.picks.find(p=>p.id===node.selectedId),card=cards.find(c=>c.slot===pick.slot);
             if(card.variantId!==pick.id)return null;
             card.variantId=pick.fromVariant;card.pure=!pick.fromVariant;
            }
            if(node.deckSignature!==roguelikeRunDeckSignature({cards})||node.picks.some(p=>cards.find(c=>c.slot===p.slot).variantId!==p.fromVariant))return null;
           }
           return{version:1,baseRevision:rewards.baseRevision,entries}
          }
          ''')

          if 'function roguelikeBattleProgress(' not in text:
              text = insert_after_function(text, 'roguelikePendingRewardNode', r'''
              function roguelikeBattleProgress(draft=loadRoguelikeRunDraft()){
               const battleEntries=draft?.rewardNodes?.entries?.filter(n=>n.source==='battle')||[],completed=battleEntries.length,current=ROGUELIKE_COMMON_START_ROUTE[completed]||null,pending=roguelikePendingRewardNode(draft);
               return{zone:ROGUELIKE_COMMON_START_ZONE,completed,total:ROGUELIKE_COMMON_START_ROUTE.length,current,pending,finished:!current,battleEntries}
              }
              function roguelikeCurrentBattleNodeRequest(draft=loadRoguelikeRunDraft()){
               if(!draft||roguelikePendingRewardNode(draft))return null;
               const progress=roguelikeBattleProgress(draft),next=roguelikeNextRewardNodeRequest(draft);
               if(!progress.current||!next)return null;
               return{...next,battleIndex:progress.completed,battleNodeId:progress.current.id,zone:ROGUELIKE_COMMON_START_ZONE}
              }
              ''')

          text = replace_function(text, 'roguelikeIssueRewardNode', r'''
          function roguelikeIssueRewardNode(request){
           const draft=loadRoguelikeRunDraft();
           if(!draft||!request||request.runId!==draft.runId||!Number.isSafeInteger(request.sequence)||request.sequence<1)return null;
           const existing=draft.rewardNodes.entries.find(n=>n.sequence===request.sequence);
           if(existing)return existing.source==='prototype'&&existing.revision===request.revision&&existing.deckSignature===request.deckSignature?existing:null;
           const next=roguelikeNextRewardNodeRequest(draft);
           if(!next||request.sequence!==next.sequence||request.revision!==next.revision||request.deckSignature!==next.deckSignature)return null;
           const profile=roguelikeRunDeckProfile(draft),id=roguelikeRewardNodeId(draft.runId,request.sequence);
           const result=roguelikeRewardCandidates({...profile,poolIds:[...unlockedNamed()],seed:id+':'+draft.runDeck.revision});
           const node={id,sequence:request.sequence,source:'prototype',algorithm:ROGUELIKE_REWARD_ALGORITHM,status:'pending',revision:draft.runDeck.revision,deckSignature:next.deckSignature,picks:result.picks.map(p=>({id:p.id,role:p.role,slot:p.slot,fromVariant:profile.variants[p.slot]||null})),selectedId:null};
           draft.rewardNodes.entries.push(node);
           return saveRoguelikeRunDraft(draft)?node:null
          }
          ''')

          if 'function roguelikeCompleteBattleNode(' not in text:
              text = insert_after_function(text, 'roguelikeIssueRewardNode', r'''
              function roguelikeCompleteBattleNode(request){
               const draft=loadRoguelikeRunDraft();
               if(!draft||!request||request.runId!==draft.runId||!Number.isSafeInteger(request.sequence)||!Number.isSafeInteger(request.battleIndex)||typeof request.battleNodeId!=='string')return null;
               const existing=draft.rewardNodes.entries.find(n=>n.source==='battle'&&n.battleNodeId===request.battleNodeId);
               if(existing)return existing.sequence===request.sequence&&existing.battleIndex===request.battleIndex&&existing.revision===request.revision&&existing.deckSignature===request.deckSignature?existing:null;
               const next=roguelikeCurrentBattleNodeRequest(draft);
               if(!next||request.sequence!==next.sequence||request.revision!==next.revision||request.deckSignature!==next.deckSignature||request.battleIndex!==next.battleIndex||request.battleNodeId!==next.battleNodeId||request.zone!==next.zone)return null;
               const profile=roguelikeRunDeckProfile(draft),id=roguelikeRewardNodeId(draft.runId,request.sequence);
               const result=roguelikeRewardCandidates({...profile,poolIds:[...unlockedNamed()],seed=id+':'+draft.runDeck.revision});
               const node={id,sequence:request.sequence,source:'battle',algorithm:ROGUELIKE_REWARD_ALGORITHM,status:'pending',revision:draft.runDeck.revision,deckSignature:next.deckSignature,picks:result.picks.map(p=>({id:p.id,role:p.role,slot:p.slot,fromVariant:profile.variants[p.slot]||null})),selectedId:null,battleIndex:next.battleIndex,battleNodeId:next.battleNodeId};
               draft.rewardNodes.entries.push(node);
               return saveRoguelikeRunDraft(draft)?node:null
              }
              ''')

          text = replace_function(text, 'roguelikeRunDraftText', r'''
          function roguelikeRunDraftText(draft=loadRoguelikeRunDraft()){
           if(!draft)return'런 덱 없음 · 스타터를 고른 뒤 새 런 덱을 만드세요.';
           const profile=roguelikeStarterProfile(draft.starterId),deck=draft.pureStart?'30장 · 순수 정규 29 + 기본 와일드 조커 1 · 효과 0':'30장 · 순수 23 + 네임드 정규 6 + 네임드 조커 1',loadout=roguelikeStarterLoadoutSummary(draft.starterId),route=roguelikeBattleProgress(draft),pending=route.pending;
           const routeText=pending?`공통 시작 실전 ${route.completed}/${route.total} · ${pending.source==='battle'?'전투 보상':'테스트 보상'} 선택 대기`:route.finished?`공통 시작 실전 ${route.total}/${route.total} 완료 · 지역 분기 구현 대기`:`공통 시작 실전 ${route.completed}/${route.total} · 다음 ${route.current.label}`;
           return`<b>${profile.name}</b> · 공통 시작 구역 · 시작 ${deck}<br>현재 런 덱 · ${draft.runDeck.cards.length}장 · 네임드 ${draft.runDeck.cards.filter(c=>c.variantId).length}장 · 교체 ${draft.runDeck.revision}회<br>${routeText}<br>시작 구성 · ${loadout}<br>카드군 하드 잠금 없음 · 직접 전투 패시브 없음 · 보상 후보 소프트 가중치 · 실제 보상 확률 미확정 · 별도 런 덱 실험전 사용 가능`
          }
          ''')

          text = replace_function(text, 'roguelikeRewardPreviewText', r'''
          function roguelikeRewardPreviewText(draft=loadRoguelikeRunDraft()){
           if(!draft)return'<span class="unlockChip">런 덱을 만든 뒤 테스트 보상 노드를 발급하세요.</span>';
           const entries=draft.rewardNodes.entries,node=entries[entries.length-1],done=entries.filter(n=>n.status!=='pending');
           const summary=`<span class="unlockChip">발급 ${entries.length}회 · 수령 ${done.filter(n=>n.status==='claimed').length}회 · 건너뜀 ${done.filter(n=>n.status==='skipped').length}회</span>`;
           const history=done.slice(-5).map(n=>`<span class="unlockChip">#${n.sequence} ${n.status==='claimed'?`수령 · ${NAMED[n.selectedId].n}`:'건너뜀'} · ${n.source==='battle'?'실전':'테스트'}</span>`).join('');
           if(!node)return summary+'<span class="unlockChip">아직 발급된 보상 노드 없음 · 아래 버튼으로 테스트 노드를 만들거나 실전 노드에 도전하세요.</span>';
           if(node.status!=='pending')return summary+history+'<span class="unlockChip">이 노드는 처리 완료되었습니다. 다음 보상 또는 실전 전투를 진행할 수 있습니다.</span>';
           const status=`<span class="unlockChip">노드 #${node.sequence} · 선택 대기 · 발급 당시 후보 고정 · ${node.source==='battle'?'실전 보상':'테스트 보상'}</span>`;
           const candidates=node.picks.map(p=>{
            const def=NAMED[p.id],role=ROGUELIKE_REWARD_ROLES.find(r=>r.id===p.role),tags=roguelikeNamedActionTags(p.id);
            return`<button class="pixelBtn" type="button" data-roguelike-reward-pick="${p.id}" data-reward-role="${p.role}" data-reward-node="${node.sequence}" title="${tags.join(' / ')||'행동 태그 없음'}"><b>${role.label}</b> · ${def.n} · ${p.slot.slice(1)}${SUIT_SYMBOL[p.slot[0]]}<br><small>${tags.join(' · ')||'기반 효과'}${def.themeId?` · ${THEME_BUILD_PROFILES[def.themeId]?.displayName||def.themeId}`:' · 범용'}</small></button>`
           }).join('');
           const hint=node.picks.length?`후보 ${node.picks.length}장 중 1장 수령 또는 건너뛰기 · 교체 선택 취소는 노드를 소모하지 않습니다.`:'현재 풀에 같은 슬롯 교체 후보가 없습니다. 건너뛰기로 이 노드를 완료하세요.';
           return summary+history+status+`<div class="roguelikeRewardCandidates">${candidates}</div><div class="sub">${hint}</div>`
          }
          ''')

          text = replace_function(text, 'renderRoguelikeStarterPicker', r'''
          function renderRoguelikeStarterPicker(){
           const grid=document.getElementById('roguelikeStarterGrid'),status=document.getElementById('roguelikeRunDraftStatus'),prepare=document.getElementById('roguelikePrepareBtn'),clear=document.getElementById('roguelikeClearDraftBtn');if(!grid)return;
           const group=grid.closest('.roguelikeStarterGroup'),heading=group?.querySelector('h4');if(heading)heading.textContent='로그라이크 런 스타터 · 전투 프로토타입';if(clear)clear.textContent='런 덱 지우기';
           let battle=document.getElementById('roguelikeBattleBtn');if(!battle&&clear?.parentElement){battle=document.createElement('button');battle.id='roguelikeBattleBtn';battle.type='button';battle.className='pixelBtn goldBtn';battle.textContent='런 덱 실험전 시작';clear.insertAdjacentElement('afterend',battle)}
           let nodeBattle=document.getElementById('roguelikeNodeBattleBtn');if(!nodeBattle&&clear?.parentElement){nodeBattle=document.createElement('button');nodeBattle.id='roguelikeNodeBattleBtn';nodeBattle.type='button';nodeBattle.className='pixelBtn primary';clear.insertAdjacentElement('afterend',nodeBattle)}
           let selected=normalizeRoguelikeStarterId(progress.roguelikeStarter);if(!roguelikeStarterUnlocked(selected))selected='wanderer';progress.roguelikeStarter=selected;
           grid.innerHTML=ROGUELIKE_STARTER_IDS.map(id=>{const p=roguelikeStarterProfile(id),open=roguelikeStarterUnlocked(id),on=id===selected,meta=p.pure?'효과카드 0장 시작 · 이후 네임드 획득 가능':`출발 성향 · ${p.short}`;return`<div class="charCard ${on?'selected':''} ${open?'':'locked'}"><div class="charName">${p.name} ${open?'':'🔒'}</div><div class="charMeta">${meta}${open?'':' · 현재 진행도에서 잠김'}</div><div class="charPassive">${p.desc}<br><b>런 원칙:</b> 다른 카드군 획득을 막지 않음</div><button class="pixelBtn ${on?'primary':''}" data-roguelike-starter="${id}" ${open?'':'disabled'}>${on?'선택됨':'선택'}</button></div>`}).join('');
           grid.querySelectorAll('[data-roguelike-starter]').forEach(b=>b.onclick=()=>{const id=b.dataset.roguelikeStarter;if(!roguelikeStarterUnlocked(id))return;progress.roguelikeStarter=id;saveProgress();renderRoguelikeStarterPicker()});
           const draft=loadRoguelikeRunDraft(),route=roguelikeBattleProgress(draft),nodeRequest=roguelikeCurrentBattleNodeRequest(draft);if(prepare)prepare.textContent=draft?'새 런 덱으로 초기화':'런 덱 만들기';if(clear)clear.disabled=!draft;
           if(battle){battle.disabled=!draft;battle.onclick=()=>{if(!startRoguelikeBattle()){renderRoguelikeStarterPicker();if(status)status.textContent='런 덱을 불러오지 못했습니다. 새 런 덱을 만들어 주세요.'}}}
           if(nodeBattle){nodeBattle.disabled=!nodeRequest;nodeBattle.textContent=!draft?'실전 노드 전투 · 런 덱 필요':route.pending?'보상 처리 후 다음 실전':route.finished?'공통 시작 실전 완료':`${route.current.label} 시작`;nodeBattle.onclick=()=>{if(!startRoguelikeNodeBattle()){renderRoguelikeStarterPicker();if(status)status.textContent=route.pending?'현재 보상을 수령하거나 건너뛴 뒤 다음 실전에 도전하세요.':route.finished?'공통 시작 실전을 모두 완료했습니다. 다음 지역 분기 구현을 기다리는 상태입니다.':'실전 노드를 시작하지 못했습니다. 런 상태를 다시 확인하세요.'}}}
           if(status)status.innerHTML=roguelikeRunDraftText(draft);if(prepare)prepare.onclick=()=>{const saved=prepareRoguelikeRunDraft(progress.roguelikeStarter);renderRoguelikeStarterPicker();if(!saved&&status)status.textContent='런 덱을 저장하지 못했습니다. 저장 공간을 확인하세요.'};if(clear)clear.onclick=()=>{clearRoguelikeRunDraft();renderRoguelikeStarterPicker()};renderRoguelikeRewardPanel(draft)
          }
          ''')

          text = replace_function(text, 'setupRoguelikeBattle', r'''
          function setupRoguelikeBattle(draft,options={}){
           const clean=normalizeRoguelikeRunDraft(draft);if(!clean)return false;
           const deck=makeRoguelikeBattleDeck(clean,'player'),p=state.player,progression=!!options.progression,expected=progression?roguelikeCurrentBattleNodeRequest(clean):null,ticket=options.nodeRequest;
           const ticketOk=!progression||(expected&&ticket&&ticket.runId===expected.runId&&ticket.sequence===expected.sequence&&ticket.revision===expected.revision&&ticket.deckSignature===expected.deckSignature&&ticket.battleIndex===expected.battleIndex&&ticket.battleNodeId===expected.battleNodeId&&ticket.zone===expected.zone);
           if(!deck||!p||!ticketOk)return false;
           state.sessionMode='roguelike';state.roguelikeBattle=true;state.roguelikeProgressionBattle=progression;state.roguelikeBattleNodeRequest=progression?{...expected}:null;state.roguelikeNodeResult=null;state.roguelikeRunId=clean.runId;state.roguelikeRunRevision=clean.runDeck.revision;state.roguelikeStarterId=clean.starterId;state.roguelikeDeckFingerprint=roguelikeBattleDeckFingerprint(clean);state.developerBattle=false;state.battleMetrics=null;
           p.charId=clean.characterId||'wanderer';p.themeId='mixed';p.deck=deck;p.hand=[];p.spent=[];p.melds=[];
           state.selected.clear();state.selectionOrder=[];state.boardSelected.clear();state.target=null;state.phase='mulligan';state.logs=[];clearEffectChoices();drawMany('player',8,false);
           const profile=roguelikeStarterProfile(clean.starterId),named=clean.runDeck.cards.filter(c=>c.variantId).length;
           if(progression){const routeNode=ROGUELIKE_COMMON_START_ROUTE[expected.battleIndex];log(`로그라이크 실전 노드 · ${routeNode.label} · ${profile.name} · 런 덱 ${clean.runDeck.cards.length}장 · 네임드 ${named}장 · 교체 ${clean.runDeck.revision}회.`,'important');log('승리하면 이 전투 자격과 현재 런 덱 지문을 검증해 보상 노드 1개를 즉시 고정 발급합니다. 패배·무승부는 노드를 소비하지 않으며 일반 클리어·레벨·해금·M12 표본에는 반영되지 않습니다.','important')}
           else{log(`로그라이크 덱 실험전 · ${profile.name} · 런 덱 ${clean.runDeck.cards.length}장 · 네임드 ${named}장 · 교체 ${clean.runDeck.revision}회.`,'important');log('전투는 런 덱의 독립 복제본을 사용합니다. 카드 상태·승패·클리어·해금·M12 표본은 저장되지 않습니다.','important')}
           render();return true
          }
          ''')

          if 'function startRoguelikeNodeBattle(' not in text:
              text = insert_after_function(text, 'startRoguelikeBattle', r'''
              function startRoguelikeNodeBattle(){
               const draft=loadRoguelikeRunDraft(),nodeRequest=roguelikeCurrentBattleNodeRequest(draft);if(!draft||!nodeRequest)return false;
               const normalSelection={selectedChar:progress.selectedChar,selectedTheme:progress.selectedTheme};
               state.tutorialStep=null;state.tutorialHintOpen=false;hideTutorialCoach();hideStartScreen();document.getElementById('progressOverlay')?.classList.remove('show');document.getElementById('overlay')?.classList.remove('show');newGame('roguelike');progress.selectedChar=normalSelection.selectedChar;progress.selectedTheme=normalSelection.selectedTheme;
               if(setupRoguelikeBattle(draft,{progression:true,nodeRequest}))return true;showStartScreen();return false
              }
              ''')

          text = replace_function(text, 'restartCurrentCombat', r'''
          function restartCurrentCombat(){
           document.getElementById('overlay')?.classList.remove('show');
           if(state.m11bExperimentBattle)return startM11BExperimentBattle(state.m11bExperimentCohort||'few',state.m11bExperimentSeed||currentM11BExperimentSeed());
           if(state.sessionMode==='roguelike'){
            if(state.roguelikeProgressionBattle){
