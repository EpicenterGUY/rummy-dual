          section = textwrap.dedent('''

          ## 20. 공통 시작 실전 노드 v1

          M11A의 첫 실제 런 진행은 전체 맵을 가장하지 않고 `공통 시작 구역`의 선형 3전투만 연결한다. 기존 `런 덱 실험전(RUN TEST)`은 회귀·체감 확인용 샌드박스로 그대로 남으며 승패를 저장하지 않는다. 별도의 `RUN NODE` 전투만 런 진행 자격을 가진다.

          - 실전 시작 시 현재 저장 런의 `runId`, 보상 sequence, `runDeck.revision`, 덱 지문, 공통 시작 전투 index/ID를 하나의 전투 티켓으로 스냅샷한다.
          - 승리 시 현재 저장 런과 티켓을 다시 비교한다. 일치할 때만 rewardNodes에 `source: battle`인 보상 노드 하나를 추가한다. 이 엔트리는 **전투 완료 영수증과 고정 보상 후보를 동시에 표현**하므로 별도 진행 저장과 보상 저장이 갈라지지 않는다.
          - `battle 출처` 보상은 기존 테스트 보상과 같은 3역할 후보 생성, 동일 슬롯 교체, 수령/건너뛰기 계약을 사용한다. 후보는 승리 저장 시점에 고정된다.
          - 저장 실패, 다른 탭/세션에서의 revision·덱 지문 변화, 잘못된 노드 ID, 오래된 승리 콜백은 아무 진행도 소비하지 않고 보상도 발급하지 않는다. 같은 승리 콜백이 다시 도착해도 이미 기록된 같은 battle 영수증만 반환한다.
          - battle 보상이 `pending`인 동안 다음 실전 전투는 잠긴다. 수령 또는 건너뛰기 후에만 다음 공통 시작 전투 티켓을 만들 수 있다.
          - 패배와 완전 순환 무승부는 저장 런의 노드 진행을 소비하지 않는다. 현재 전투를 다시 시도할 수 있다.
          - 세 번째 battle 영수증까지 처리하면 공통 시작 3연전은 완료 상태가 된다. **지역 선택/분기, 엘리트, 보스, 상점, 이벤트는 아직 구현하지 않았으므로 전체 `실제 맵/전투 노드와 보상 발급 연결` 마일스톤은 계속 열린다.**
          - 실전 노드도 일반 클리어 수, 캐릭터 레벨, 해금, M12 일반 전투 표본에는 기록하지 않는다. 런 전용 지표/런 종료 규칙은 후속 단계에서 별도로 추가한다.
          ''').rstrip() + '\n'
          if '## 20. 공통 시작 실전 노드 v1' not in md:
              master.write_text(md.rstrip() + section, encoding='utf-8')

          checks = [
              'const ROGUELIKE_COMMON_START_ROUTE=Object.freeze([',
              "['prototype','battle'].includes(source)",
              'function roguelikeCompleteBattleNode(',
              'function startRoguelikeNodeBattle(',
              "state.roguelikeProgressionBattle?'RUN NODE':'RUN TEST'",
              "nodeBattle.id='roguelikeNodeBattleBtn'",
          ]
          final = index.read_text(encoding='utf-8')
          for check in checks:
              if check not in final:
                  raise SystemExit('missing patched marker: '+check)
          print('M11A common-start battle patch applied.')
          PY

      - name: Run all regression suites
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test in tests/*.mjs; do
            echo "==> $test"
            node "$test"
            count=$((count+1))
          done
          echo "Regression suites passed: $count"

      - name: Run M11A economy experiment
        shell: bash
        run: node experiments/m11a-growth-economy.mjs

      - name: Commit project patch
        shell: bash
        run: |
          if git diff --quiet -- index.html ROADMAP.md docs/ROGUELIKE_MASTER_PLAN.md tests/m11a-reward-nodes.mjs tests/m11a-run-progression.mjs; then
            echo 'No project changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/ROGUELIKE_MASTER_PLAN.md tests/m11a-reward-nodes.mjs tests/m11a-run-progression.mjs
          git commit -m 'feat: connect common-start battles to run rewards'
          git push origin HEAD:main
