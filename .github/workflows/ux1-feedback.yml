name: Verify UX1 switch and RUMMY feedback

on:
  push:
    branches:
      - feat/ux1-feedback-fx-20260830

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux1-feedback-fx-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UX1 feedback patch
        run: |
          python3 scripts/ux1_feedback_patch.py
          python3 scripts/ux1_feedback_compat.py
      - name: Run regressions
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];fs.writeFileSync('/tmp/game.js',m.at(-1)[1]);"
          node --check /tmp/game.js
          for f in tests/*.mjs; do echo "== $f =="; node "$f"; done
          git diff --check
      - name: Commit verified changes
        run: |
          rm scripts/ux1_feedback_patch.py scripts/ux1_feedback_compat.py
          rm .github/workflows/ux1-feedback.yml
          git config user.name "EpicenterGUY"
          git config user.email "mintbamtol7@gmail.com"
          git add -A
          git commit -m "Polish switch movement and RUMMY feedback"
          git push origin HEAD:feat/ux1-feedback-fx-20260830
