name: One-time P3 Theme Accent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-p3-theme-accent.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply restrained theme accents
        run: python3 .github/scripts/p3_theme_accent_patch.py
      - name: Install theme accent regression
        shell: bash
        run: |
          cp .github/scripts/p3_theme_accent_regression.mjs tests/p3-theme-accent.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/p3-theme-accent.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/p3-theme-accent.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit restrained theme accents
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/*.mjs
          git commit -m 'ui: restrain theme identity to accent layer'
          git pull --rebase origin main
          git push origin HEAD:main
# rerun after narrowing the no-background-replacement regression to the theme root surfaces
