name: One-time three-theme 60-card integration

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/theme-60-integration-patch.py'
      - '.github/workflows/one-time-theme-60-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 60-card integration patch
        run: python .github/scripts/theme-60-integration-patch.py

      - name: Syntax gate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const s=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).join('\n');
          new Function(s);
          console.log('PASS: combined game script parses');
          NODE

      - name: Run 60-card integration gates
        run: |
          set -euo pipefail
          node tests/theme-60-integration.mjs
          node tests/theme-tutorial-foundation.mjs
          node tests/character-theme-picker.mjs
          node tests/vsignal-tutorial.mjs
          node tests/m11a-region-encounters.mjs
          node tests/m11a-region-rewards.mjs
          node tests/vsignal-full-pool.mjs
          node tests/zero-sight-full-pool.mjs
          node tests/point-blank-full-pool.mjs
          node tests/theme-mix-simulation.mjs
          node tests/m11-slot-invariant.mjs
          node tests/named-card-audit.mjs

      - name: Run all regression suites with first-failure diagnostic
        run: |
          set -u
          count=0
          for test in tests/*.mjs; do
            if ! node "$test" >/tmp/theme60-test.log 2>&1; then
              echo "FAILED_TEST=$test"
              echo '--- FAILURE TAIL ---'
              tail -n 200 /tmp/theme60-test.log
              exit 1
            fi
            count=$((count+1))
          done
          echo "ALL_TESTS_PASSED=$count"

      - name: Commit 60-card integration
        run: |
          git add index.html ROADMAP.md docs/THEME_FULL_POOL_PLAN.md tests/vsignal-full-pool.mjs tests/zero-sight-full-pool.mjs tests/point-blank-full-pool.mjs tests/theme-tutorial-foundation.mjs tests/character-theme-picker.mjs tests/theme-60-integration.mjs
          if git diff --cached --quiet; then
            echo 'No feature changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate completed 60-card theme pool'
          git pull --rebase origin main
          git push origin HEAD:main
