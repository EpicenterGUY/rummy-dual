name: One-time POINT-BLANK Quick Reload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-point-blank-quick-reload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Quick Reload patch
        run: python3 .github/scripts/point_blank_quick_reload_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/point_blank_quick_reload_regression.mjs tests/point-blank-quick-reload.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/point-blank-quick-reload.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/point-blank-quick-reload.mjs
          sed -i "s|fs.readFileSync('docs/THEME_GROUPS.md','utf8')|fs.readFileSync(new URL('../docs/THEME_GROUPS.md',import.meta.url),'utf8')|" tests/point-blank-quick-reload.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit Quick Reload
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/THEME_GROUPS.md tests/point-blank-quick-reload.mjs
          git commit -m 'feat: implement POINT-BLANK Quick Reload'
          git pull --rebase origin main
          git push origin HEAD:main
