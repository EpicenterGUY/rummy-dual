name: One-time M11 deckbuilder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11-deckbuilder.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M11 deckbuilder patch
        run: python3 .github/scripts/m11_deckbuilder_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/m11_deckbuilder_regression.mjs tests/m11-deckbuilder.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/m11-deckbuilder.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/m11-deckbuilder.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit M11 deckbuilder
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/m11-deckbuilder.mjs
          git commit -m 'feat: complete M11 52-slot deckbuilder'
          git pull --rebase origin main
          git push origin HEAD:main
