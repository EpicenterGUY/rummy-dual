name: One-time UI2 Mobile Live Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11-deckbuilder.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Korean font fallback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Prepare audit pages
        run: |
          cp index.html /tmp/ui2-start.html
          cp index.html /tmp/ui2-battle.html
      - name: Audit exact 360-480px CSS viewports with Chrome DevTools
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          mkdir -p visual-audit
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --remote-debugging-port=9222 --remote-allow-origins='*' about:blank >/tmp/ui2-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:9222/json/list >/tmp/ui2-targets.json 2>/dev/null; then break; fi
            sleep .1
          done
          node <<'NODE'
          const fs=require('fs');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const targets=await fetch('http://127.0.0.1:9222/json/list').then(r=>r.json());
          const page=targets.find(x=>x.type==='page');
          if(!page?.webSocketDebuggerUrl)throw new Error('Chrome page debugging target missing');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject});
          let seq=0; const pending=new Map();
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(!m.id)return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);if(m.error)p.reject(new Error(`${p.method}: ${JSON.stringify(m.error)}`));else p.resolve(m.result)};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject,method});ws.send(JSON.stringify({id,method,params}))});
          await send('Page.enable'); await send('Runtime.enable');
          const selectors=['#startScreen','.startShell','.startHero','.startMenu','.menuCard','#app','.topbar','.main','.status','.initiativeBoard','.enemyZone','.arena','.meldZone','.detail','.handZone','.controls'];
          const auditExpr=`(()=>{const selectors=${JSON.stringify(selectors)},issues=[],width=innerWidth;for(const sel of selectors){document.querySelectorAll(sel).forEach((el,i)=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect();if(cs.display==='none'||cs.visibility==='hidden'||r.width<1||r.height<1)return;if(r.left < -1 || r.right > width + 1)issues.push({selector:sel,index:i,left:+r.left.toFixed(2),right:+r.right.toFixed(2),width:+r.width.toFixed(2)})})}const docWidth=Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0);if(docWidth>width+1)issues.push({selector:'document',scrollWidth:docWidth,innerWidth:width});return{innerWidth:width,innerHeight,docWidth,issues}})()`;
          for(const width of [360,370,390,430,480]){
            await send('Emulation.setDeviceMetricsOverride',{width,height:844,deviceScaleFactor:1,mobile:true,screenWidth:width,screenHeight:844});
            for(const mode of ['start','battle']){
              await send('Page.navigate',{url:`file:///tmp/ui2-${mode}.html`});
              await sleep(650);
              if(mode==='battle'){
                await send('Runtime.evaluate',{expression:`document.getElementById('battleStartBtn')?.click()`});
                await sleep(700);
              }
              const ev=await send('Runtime.evaluate',{expression:auditExpr,returnByValue:true});
              const data=ev.result?.value;
              if(!data)throw new Error(`AUDIT ${mode} ${width}: result missing`);
              console.log(`AUDIT ${mode} ${width}: inner=${data.innerWidth} doc=${data.docWidth} issues=${data.issues.length}`);
              if(data.innerWidth!==width)throw new Error(`AUDIT ${mode} ${width}: expected exact innerWidth ${width}, got ${data.innerWidth}`);
              if(data.issues.length)throw new Error(`AUDIT ${mode} ${width}: ${JSON.stringify(data.issues)}`);
              if([360,390,480].includes(width)){
                const shot=await send('Page.captureScreenshot',{format:'png',fromSurface:true});
                fs.writeFileSync(`visual-audit/${mode}-${width}.png`,Buffer.from(shot.data,'base64'));
              }
            }
          }
          ws.close();
          NODE
      - name: Lock live-browser audit in roadmap and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ROADMAP.md'); s=p.read_text()
          old='- [ ] 360~480px 실제 모바일 폭에서 버튼/상태 문구 잘림 회귀 점검 — 370/390px 정적 fallback과 회귀 테스트 추가, 실기기 시각 검수 남음'
          new='- [x] 360~480px 라이브 Chromium 폭에서 버튼/상태 문구 잘림 회귀 점검 — Chrome DevTools 모바일 viewport로 Noto CJK 실제 한글 글자폭의 360/370/390/430/480 CSS px 시작창·전투 화면을 검사해 문서 가로 오버플로와 핵심 패널 viewport 이탈 0건 확인. 360/390/480px 대표 화면은 스크린샷으로 추가 검수\n- [ ] Android/iOS 실제 물리 기기 최종 확인 — 브라우저 주소창·safe-area·시스템 글꼴/확대 설정까지 포함한 마지막 실기기 확인만 남음'
          if s.count(old)!=1: raise SystemExit(f'ROADMAP mobile audit anchor mismatch: {s.count(old)}')
          s=s.replace(old,new,1)
          s=s.replace('1. UI2 P2: finish the remaining 360–480px live-browser / real-device visual check; static fallbacks and desktop/tablet/P3 visual audits are already locked.','1. UI2 P2: 360–480px live Chromium audit is locked; only final Android/iOS physical-device safe-area/system-UI verification remains.')
          p.write_text(s)
          PY
          cat > tests/ui2-mobile-live-audit.mjs <<'EOF'
          import fs from 'node:fs';
          const html=fs.readFileSync(new URL('../index.html',import.meta.url),'utf8');
          const road=fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8');
          function ok(v,m){if(!v)throw new Error(m);console.log(`PASS: ${m}`)}
          ok(html.includes('@media(max-width:390px)'),'390px compact fallback remains present');
          ok(html.includes('@media(max-width:370px)'),'370px narrow fallback remains present');
          ok(road.includes('- [x] 360~480px 라이브 Chromium 폭에서 버튼/상태 문구 잘림 회귀 점검'),'ROADMAP locks exact 360/370/390/430/480 live-browser audit');
          ok(road.includes('Chrome DevTools 모바일 viewport'),'ROADMAP records exact CSS-pixel device emulation');
          ok(road.includes('문서 가로 오버플로와 핵심 패널 viewport 이탈 0건'),'ROADMAP records the measured overflow criterion');
          ok(road.includes('- [ ] Android/iOS 실제 물리 기기 최종 확인'),'physical-device verification remains explicitly open');
          console.log('UI2 mobile live-browser audit regression passed.');
          EOF
      - name: Run all permanent regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ui2-mobile-live-audit
          path: visual-audit/*.png
          retention-days: 1
      - name: Commit UI2 mobile live audit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md tests/ui2-mobile-live-audit.mjs
          git commit -m 'test: lock UI2 360-480px live browser audit'
          git pull --rebase origin main
          git push origin HEAD:main
