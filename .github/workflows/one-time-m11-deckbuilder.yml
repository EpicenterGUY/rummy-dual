name: One-time M12 UI2 Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11-deckbuilder.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-run permanent regressions before cleanup
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Remove completed one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/m12_battle_metrics_patch.py \
            .github/scripts/m12_battle_metrics_regression.mjs \
            .github/scripts/m12_metrics_viewer_patch.py \
            .github/scripts/m12_metrics_viewer_regression.mjs \
            .github/workflows/one-time-m11-deckbuilder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/scripts .github/workflows
          if git diff --cached --quiet; then
            echo 'No one-time helper files left to clean.'
            exit 0
          fi
          git commit -m 'chore: clean completed M12 and UI2 helpers'
          git pull --rebase origin main
          git push origin HEAD:main
