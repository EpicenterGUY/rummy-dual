name: One-time M12 Battle Metrics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11-deckbuilder.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M12 battle metrics
        run: python3 .github/scripts/m12_battle_metrics_patch.py
      - name: Install M12 metrics regression
        shell: bash
        run: |
          cp .github/scripts/m12_battle_metrics_regression.mjs tests/m12-battle-metrics.mjs
          sed -i "s|fs.readFileSync('index.html','utf8')|fs.readFileSync(new URL('../index.html',import.meta.url),'utf8')|" tests/m12-battle-metrics.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/m12-battle-metrics.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit M12 battle metrics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/m12-battle-metrics.mjs
          git commit -m 'feat: add per-battle M12 metrics history'
          git pull --rebase origin main
          git push origin HEAD:main
