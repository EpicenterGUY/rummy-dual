name: Verify Korean terminology pass 1

on:
  push:
    branches:
      - feat/korean-terms-pass1-20260830

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/korean-terms-pass1-20260830
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply terminology patch
        run: |
          sed -i "/target selected label/d" scripts/apply_korean_terms_pass1.py
          python scripts/apply_korean_terms_pass1.py
      - name: Run regressions
        run: |
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
          git diff --check
      - name: Commit verified changes
        run: |
          rm -f scripts/apply_korean_terms_pass1.py
          rm -f .github/workflows/korean-terms-pass1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: localize core battle terminology"
          git push origin HEAD:feat/korean-terms-pass1-20260830
