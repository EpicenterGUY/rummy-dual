name: Verify UI2 tactical table redesign
on:
  push:
    branches: [feat/ui2-tactical-table-redesign-20260830]
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply visual reset
        run: python tools/ui2_patch.py
      - name: Run regressions
        run: |
          for f in tests/*.mjs; do node "$f"; done
          git diff --check
      - name: Commit verified changes
        run: |
          rm -f tools/ui2_patch.py .github/workflows/ui2-tactical-table.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/ui2_patch.py .github/workflows/ui2-tactical-table.yml
          git commit -m "feat: shift UI toward tactical tabletop"
          git push
