name: One-time P3 Theme Visual Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-p3-theme-visual-audit.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Korean font fallback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Prepare restrained theme accent sheet
        shell: bash
        run: |
          cp index.html /tmp/p3-theme-audit.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p3-theme-audit.html')
          s=p.read_text()
          inject=r'''<script>
          window.addEventListener('load',()=>setTimeout(()=>{
            document.getElementById('startScreen')?.classList.add('hidden');
            const app=document.getElementById('app');
            app.dataset.theme='v-signal';
            const named=(theme,rank,suit,name)=>`<div style="width:94px;height:140px"><div class="card named theme-${theme}"><div class="corner">${rank}<br>${suit}</div><div class="centerSuit">${suit}</div><div class="namedMark">${name}</div><div class="corner bottom">${rank}<br>${suit}</div></div></div>`;
            app.innerHTML=`<main style="min-height:100vh;padding:34px;background:#182126;color:#edf0ea;font-family:'Noto Sans CJK KR',sans-serif">
              <h1 style="font-size:24px;margin:0 0 6px">P3 테마 포인트 실렌더</h1>
              <p style="margin:0 0 22px;color:#aeb9b7">공통 전술 보드는 유지하고 테마 정체성은 작은 포인트에만 사용</p>
              <div id="charBadge" class="badge" style="margin-bottom:22px">유랑자 · V-SIGNAL</div>
              <section id="themeGroupGrid" class="charGrid" style="max-width:720px;margin-bottom:26px">
                <div class="charCard selected" data-theme-card="v-signal"><div class="charName">V-SIGNAL</div><div class="charMeta">방송 콤보</div><div class="charPassive">자주색은 선택 카드의 얇은 포인트에만 사용</div></div>
                <div class="charCard" data-theme-card="zero-sight"><div class="charName">ZERO-SIGHT</div><div class="charMeta">정밀 표적</div><div class="charPassive">청회색 포인트</div></div>
                <div class="charCard" data-theme-card="point-blank"><div class="charName">POINT-BLANK</div><div class="charMeta">근접 교대</div><div class="charPassive">녹슨 황동 포인트</div></div>
              </section>
              <section style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap">
                <div><b>V-SIGNAL</b><div style="margin-top:8px">${named('v-signal','5','♥','앙코르')}</div></div>
                <div><b>ZERO-SIGHT</b><div style="margin-top:8px">${named('zero-sight','5','♣','매복한 관측자')}</div></div>
                <div><b>POINT-BLANK</b><div style="margin-top:8px">${named('point-blank','7','♠','돌입 카드')}</div></div>
              </section>
            </main>`;
          },140));
          </script>'''
          s=s.replace('</body>',inject+'</body>',1)
          p.write_text(s)
          PY
      - name: Capture theme accent sheet
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          mkdir -p visual-audit
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --window-size=1366,768 --virtual-time-budget=1600 --screenshot="visual-audit/theme-accent-sheet.png" "file:///tmp/p3-theme-audit.html"
      - uses: actions/upload-artifact@v4
        with:
          name: p3-theme-visual-audit
          path: visual-audit/theme-accent-sheet.png
          retention-days: 1
