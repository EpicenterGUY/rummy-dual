name: One-time M8 shared named choice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m8-shared-choice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply shared named choice patch
        run: python3 .github/scripts/m8_shared_choice_patch.py
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/named-choice-ui.mjs
          git commit -m 'feat: add shared named effect choices'
          git push origin HEAD:main
