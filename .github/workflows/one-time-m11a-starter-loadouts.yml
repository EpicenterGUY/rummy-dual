name: One-time M11A Starter Loadouts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m11a-starter-loadouts.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply starter loadout patch
        run: python .github/scripts/patch_m11a_starter_loadouts.py
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Recheck structural baseline
        env:
          M11A_ECONOMY_SEEDS: '4000'
        run: node experiments/m11a-growth-economy.mjs
      - name: Commit M11A starter loadouts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md docs/ROGUELIKE_MASTER_PLAN.md docs/ROGUELIKE_DECK_STARTERS.md tests/m11a-starter-loadouts.mjs
          git diff --cached --check
          git commit -m 'feat: lock M11A starter loadouts v1'
          git push origin HEAD:main
