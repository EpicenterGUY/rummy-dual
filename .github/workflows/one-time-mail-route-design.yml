name: One-time MAIL ROUTE Design Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-mail-route-design.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply MAIL ROUTE design lock
        run: python3 .github/scripts/mail_route_design_patch.py
      - name: Install regression
        shell: bash
        run: |
          cp .github/scripts/mail_route_design_regression.mjs tests/mail-route-design-lock.mjs
          sed -i "s|fs.readFileSync('docs/THEME_GROUPS.md','utf8')|fs.readFileSync(new URL('../docs/THEME_GROUPS.md',import.meta.url),'utf8')|" tests/mail-route-design-lock.mjs
          sed -i "s|fs.readFileSync('ROADMAP.md','utf8')|fs.readFileSync(new URL('../ROADMAP.md',import.meta.url),'utf8')|" tests/mail-route-design-lock.mjs
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit design lock
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/THEME_GROUPS.md ROADMAP.md tests/*.mjs
          git commit -m 'docs: lock MAIL ROUTE core rules'
          git pull --rebase origin main
          git push origin HEAD:main
