name: One-time M8 final lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m8-final-lock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M8 lock patch
        run: python3 .github/scripts/m8_lock_patch.py
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit M8 lock
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md tests/m8-final-lock.mjs
          git commit -m 'test: lock first named-card pool behavior'
          git push origin HEAD:main
