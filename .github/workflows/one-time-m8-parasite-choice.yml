name: One-time M8 Parasite choice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-m8-parasite-choice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Parasite choice patch
        run: python3 .github/scripts/m8_parasite_choice_patch.py
      - name: Preserve isolated resolveEffects compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="if(ctx.isAttach&&isReturning&&!fx.parasiteChecked){fx.parasiteChecked=true;const parasitePaused=requestParasiteReturnCycles(w,ctx.meld,()=>{if(typeof ctx.resumeEffects==='function')ctx.resumeEffects()});if(parasitePaused)return pause()}"
          new="if(ctx.isAttach&&isReturning&&!fx.parasiteChecked&&typeof requestParasiteReturnCycles==='function'){fx.parasiteChecked=true;const parasitePaused=requestParasiteReturnCycles(w,ctx.meld,()=>{if(typeof ctx.resumeEffects==='function')ctx.resumeEffects()});if(parasitePaused)return pause()}"
          if old not in s: raise SystemExit('missing Parasite guard target')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Run all regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*.mjs; do
            echo "== $f =="
            node "$f"
          done
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ROADMAP.md tests/named-parasite-choice.mjs
          git commit -m 'feat: make Parasite discard selectable'
          git push origin HEAD:main
